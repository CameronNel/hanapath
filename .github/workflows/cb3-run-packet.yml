name: CB3 Run Packet

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  run-packet:
    name: Execute CB3 packet recipe once
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check whether packet is already built
        id: needed
        shell: bash
        run: |
          if [[ -f scripts/build-sentence-lesson-contrasts-sections-5-8.mjs ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check packet runner syntax
        if: steps.needed.outputs.value == 'true'
        run: python -m py_compile scripts/cb3-run-packet.py

      - name: Execute packet recipe
        if: steps.needed.outputs.value == 'true'
        run: python scripts/cb3-run-packet.py

      - name: Upload packet failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cb3-run-error
          path: .cb3-run-error.log
          if-no-files-found: warn
