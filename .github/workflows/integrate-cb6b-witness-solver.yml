name: integrate-cb6b-witness-solver

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event_name == 'push' || github.head_ref == 'core/cb6b-controlled-clause-reauthor'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/cb6b-controlled-clause-reauthor
          fetch-depth: 0
      - name: Patch builder and bound the deterministic search
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-sentence-exam-capacity-remediation.mjs')
          s = p.read_text()
          s = s.replace(
            'import vm from "node:vm";\n',
            'import vm from "node:vm";\nimport { repairCb6bWitness } from "./lib/sentence-exam-cb6b-witness.mjs";\n'
          )
          old = '''const CONTROLLED_BY_ID = new Map(Object.entries(CONTROLLED_AUTHORING.entries || {}));
          const REPLACEMENT_BY_DEMOTED = new Map((REPLACEMENT_AUTHORING.mappings || []).map((item) => [item.demotedId, item.replacementId]));
          const DEMOTED_IDS = new Set(REPLACEMENT_BY_DEMOTED.keys());
          const EFFECTIVE_SELECTED = Object.freeze([
            ...SELECTED.filter((selection) => !DEMOTED_IDS.has(selection.id)),
            ...[...REPLACEMENT_BY_DEMOTED.values()].map((id) => Object.freeze({ id, mode: "typed" })),
          ]);
          const CB6B_WITNESS = Object.freeze(Object.fromEntries(Object.entries(WITNESS).map(([examId, attempts]) => [
            examId,
            attempts.map((attempt) => attempt.map((selected) => ({
              ...selected,
              id: REPLACEMENT_BY_DEMOTED.get(selected.id) || selected.id,
            }))),
          ])));
          '''
          new = '''const CONTROLLED_BY_ID = new Map(Object.entries(CONTROLLED_AUTHORING.entries || {}));
          const REPLACEMENT_BY_DEMOTED = new Map((REPLACEMENT_AUTHORING.mappings || []).map((item) => [item.demotedId, item.replacementId]));
          const DEMOTED_IDS = new Set(REPLACEMENT_BY_DEMOTED.keys());
          const RECOGNITION_BACKFILLS = Array.isArray(REPLACEMENT_AUTHORING.recognitionBackfills)
            ? REPLACEMENT_AUTHORING.recognitionBackfills
            : [];
          const PROMOTED_RECOGNITION_IDS = new Set(RECOGNITION_BACKFILLS.map((item) => item.promotedId));
          const EFFECTIVE_SELECTED = Object.freeze([
            ...SELECTED.filter((selection) => !DEMOTED_IDS.has(selection.id) && !PROMOTED_RECOGNITION_IDS.has(selection.id)),
            ...[...REPLACEMENT_BY_DEMOTED.values()].map((id) => Object.freeze({ id, mode: "typed" })),
            ...RECOGNITION_BACKFILLS.map((item) => Object.freeze({ id: item.backfillId, mode: "recognition" })),
          ]);
          '''
          if old not in s:
            raise SystemExit('old effective selection block not found')
          s = s.replace(old, new)
          s = s.replace(
            '  const combinedEntries = [...bank.entries, ...entries];\n  const currentCapacity = capacitySummary(bank.entries);',
            '  const combinedEntries = [...bank.entries, ...entries];\n  const repairedWitness = repairCb6bWitness({\n    baseWitness: WITNESS,\n    entries: combinedEntries,\n    replacementByDemoted: REPLACEMENT_BY_DEMOTED,\n  });\n  const currentCapacity = capacitySummary(bank.entries);'
          )
          s = s.replace('    exams: CB6B_WITNESS,', '    exams: repairedWitness.exams,')
          s = s.replace('Wrote CB6 authoring', 'Wrote CB6B authoring')
          p.write_text(s)

          p = Path('scripts/lib/sentence-exam-cb6b-witness.mjs')
          s = p.read_text()
          s = s.replace('const iterations = examId === "sentence-exam-5" ? 500000 : 250000;', 'const iterations = examId === "sentence-exam-5" ? 60000 : 30000;')
          s = s.replace('for (let restart = 0; restart < 8 && best.diagnostics.score > 0; restart += 1)', 'for (let restart = 0; restart < 3 && best.diagnostics.score > 0; restart += 1)')
          s = s.replace('for (let pass = 0; pass < 6; pass += 1)', 'for (let pass = 0; pass < 3; pass += 1)')
          p.write_text(s)
          PY
      - name: Generate repaired witness
        id: generate
        continue-on-error: true
        run: |
          set -o pipefail
          node --check scripts/lib/sentence-exam-cb6b-witness.mjs
          node --check scripts/build-sentence-exam-capacity-remediation.mjs
          time node scripts/build-sentence-exam-capacity-remediation.mjs --write 2>&1 | tee /tmp/cb6b-solver.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/cb6b-solver.log docs/generated/sentence_exam_cb6b_solver_failure.txt
            exit "$status"
          fi
          rm -f docs/generated/sentence_exam_cb6b_solver_failure.txt
          node scripts/audit-sentence-exam-capacity-remediation.mjs
      - name: Refresh validation reports
        if: steps.generate.outcome == 'success'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { detectAmbiguityFlags, validateControlledClauseContract } from './scripts/lib/sentence-exam-ambiguity.mjs';
          import { auditCapacityRemediationState } from './scripts/audit-sentence-exam-capacity-remediation.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const authoring = read('docs/generated/sentence_exam_cb6_capacity_authoring.json');
          const inventory = read('docs/generated/sentence_exam_inventory.json');
          const rows = new Map(inventory.inventory.map((row) => [row.id, row]));
          const failures = [];
          const summaries = [];
          for (const entry of authoring.entries.filter((item) => item.mode === 'typed')) {
            const row = rows.get(entry.id);
            let contract = null;
            if (entry.templateId === 'controlled-clause-transformation') {
              const validation = validateControlledClauseContract(row, entry.examPromptEn, entry.controlledClause);
              if (!validation.valid) failures.push(`${entry.id}: contract: ${validation.errors.join(' | ')}`);
              contract = entry.controlledClause;
            }
            const analysis = detectAmbiguityFlags(row, entry.examPromptEn, {
              requiresLexicalAnchor: entry.requiresLexicalAnchor === true,
              controlledClauseContract: contract,
            });
            if (analysis.flags.length) failures.push(`${entry.id}: flags: ${analysis.flags.join(', ')}`);
            summaries.push({ id: entry.id, templateId: entry.templateId, flags: analysis.flags, contractErrors: analysis.controlledClauseContractErrors });
          }
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_runtime_validation.json', `${JSON.stringify({ schemaVersion: 1, revision: authoring.revision, failureCount: failures.length, failures, summaries }, null, 2)}\n`);
          const sandbox = { window: {} };
          sandbox.self = sandbox.window;
          sandbox.globalThis = sandbox.window;
          vm.createContext(sandbox);
          for (const file of ['sentence_exam_curated_bank.js', 'sentence_exam_curated_bank_freeze.js']) vm.runInContext(fs.readFileSync(file, 'utf8'), sandbox, { filename: file });
          const result = auditCapacityRemediationState({
            authoring,
            reviews: read('docs/reviews/sentence_exam_cb6_capacity_reviews.json'),
            witness: read('docs/generated/sentence_exam_cb6_capacity_witness.json'),
            inventory,
            bank: sandbox.window.HANAPATH_SENTENCE_EXAM_CURATED_BANK,
            requireApproved: false,
          });
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_capacity_audit.json', `${JSON.stringify({ schemaVersion: 1, ...result }, null, 2)}\n`);
          if (failures.length || !result.ok) process.exit(1);
          NODE
      - name: Commit bounded solver or its exact diagnostics
        if: always()
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/integrate-cb6b-witness-solver.yml
          git add scripts docs/generated docs/reviews
          git diff --cached --check
          git commit -m "CB6B: integrate bounded five-attempt witness solver"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
