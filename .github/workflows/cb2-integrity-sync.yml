name: CB2 Integrity Sync

on:
  pull_request:
    paths:
      - ".github/workflows/cb2-integrity-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Synchronize CB2 integrity version pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Update app and integrity audit pins
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Missing expected pin in {path}: {old}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace("app.js", 'const EXAM_INTEGRITY_APP_VERSION = "hanapath-shell-v449";', 'const EXAM_INTEGRITY_APP_VERSION = "hanapath-shell-v450";')
          replace("app.js", 'const EXAM_INTEGRITY_ASSET_REVISION = "20260725a";', 'const EXAM_INTEGRITY_ASSET_REVISION = "20260726a";')
          replace("scripts/audit-exam-integrity.mjs", 'const appRef = index.indexOf("./app.js?v=20260725a");', 'const appRef = index.indexOf("./app.js?v=20260726a");')
          replace("scripts/audit-exam-integrity.mjs", 'assert.match(sw, /hanapath-shell-v449/);', 'assert.match(sw, /hanapath-shell-v450/);')
          replace("scripts/audit-exam-integrity.mjs", 'assert.match(sw, /\\.\\/app\\.js\\?v=20260725a/);', 'assert.match(sw, /\\.\\/app\\.js\\?v=20260726a/);')
          replace("scripts/audit-exam-integrity.mjs", 'assert.match(app, /const EXAM_INTEGRITY_APP_VERSION = "hanapath-shell-v449"/);', 'assert.match(app, /const EXAM_INTEGRITY_APP_VERSION = "hanapath-shell-v450"/);')
          replace("scripts/audit-exam-integrity.mjs", 'assert.match(app, /const EXAM_INTEGRITY_ASSET_REVISION = "20260725a"/);', 'assert.match(app, /const EXAM_INTEGRITY_ASSET_REVISION = "20260726a"/);')
      - name: Validate integrity and CB2 focused contracts
        run: |
          node --check app.js
          node --check scripts/audit-exam-integrity.mjs
          node scripts/audit-exam-integrity.mjs
          node scripts/build-sentence-lesson-contrasts.mjs --check
          node scripts/audit-sentence-lesson-contrasts.mjs
      - name: Commit integrity synchronization
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/audit-exam-integrity.mjs
          if git diff --cached --quiet; then
            echo "Integrity pins already synchronized."
            exit 0
          fi
          git commit -m "CB2: synchronize integrity version pins"
          git push origin "HEAD:${HEAD_BRANCH}"
