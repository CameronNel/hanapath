name: CB2 Generate and Validate

on:
  pull_request:
    paths:
      - ".github/workflows/cb2-generate-and-validate.yml"
      - "scripts/apply-cb2-runtime-patches.py"
      - "sentence_lesson_contrast_ui.js"
      - "scripts/build-sentence-lesson-contrasts.mjs"
      - "scripts/lib/sentence-lesson-contrast-authoring.mjs"
      - "scripts/audit-sentence-lesson-contrasts.mjs"
      - "scripts/test-sentence-lesson-contrast-authoring.mjs"
      - "scripts/test-sentence-lesson-contrast-ui.mjs"
      - "scripts/test-sentence-lesson-contrasts-browser.mjs"
      - "tests/fixtures/sentence_lesson_contrasts.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cb2-generate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and validate CB2 lesson contrasts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply learner-facing and gate wiring
        run: python scripts/apply-cb2-runtime-patches.py
      - name: Generate deterministic contrast contracts
        run: node scripts/build-sentence-lesson-contrasts.mjs --write
      - name: Run focused CB2 validation
        run: |
          node --check app.js
          node --check sw.js
          node --check sentence_lesson_contrast_ui.js
          node --check sentence_lesson_contrasts_sections_1_4.js
          node --check scripts/build-sentence-lesson-contrasts.mjs
          node --check scripts/lib/sentence-lesson-contrast-authoring.mjs
          node --check scripts/audit-sentence-lesson-contrasts.mjs
          node --check scripts/test-sentence-lesson-contrast-authoring.mjs
          node --check scripts/test-sentence-lesson-contrast-ui.mjs
          node --check scripts/test-sentence-lesson-contrasts-browser.mjs
          node scripts/test-sentence-lesson-contrast-authoring.mjs
          node scripts/test-sentence-lesson-contrast-ui.mjs
          node scripts/build-sentence-lesson-contrasts.mjs --check
          node scripts/audit-sentence-lesson-contrasts.mjs
          node scripts/test-sentence-lesson-contrasts-browser.mjs
          node scripts/audit-app-shell.mjs
      - name: Refresh deterministic core status
        run: node scripts/audit-core-release.mjs --write-status
      - name: Commit CB2 generated and wired implementation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            app.js index.html sw.js \
            sentence_lesson_contrasts_sections_1_4.js \
            docs/generated/sentence_lesson_contrasts_sections_1_4.json \
            docs/CORE_APP_STATUS.md \
            scripts/audit-app-shell.mjs \
            scripts/audit-core-release.mjs
          if git diff --cached --quiet; then
            echo "CB2 generated contracts and wiring already current."
            exit 0
          fi
          git commit -m "CB2: wire and generate sections 1-4 lesson contrasts"
          git push origin "HEAD:${HEAD_BRANCH}"
