name: CB2 Generate and Validate

on:
  pull_request:
    paths:
      - ".github/workflows/cb2-generate-and-validate.yml"
      - "app.js"
      - "index.html"
      - "sw.js"
      - "sentence_lesson_contrast_ui.js"
      - "scripts/build-sentence-lesson-contrasts.mjs"
      - "scripts/lib/sentence-lesson-contrast-authoring.mjs"
      - "scripts/audit-sentence-lesson-contrasts.mjs"
      - "scripts/test-sentence-lesson-contrast-authoring.mjs"
      - "scripts/test-sentence-lesson-contrast-ui.mjs"
      - "scripts/test-sentence-lesson-contrasts-browser.mjs"
      - "tests/fixtures/sentence_lesson_contrasts.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cb2-generate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and validate CB2 lesson contrasts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply learner-facing and gate wiring
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  print(f'already patched: {path}')
                  return
              if old not in text:
                  raise SystemExit(f'missing expected source in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'patched: {path}')

          replace_once('app.js', 'function buildSentenceLessonQuestionPlan(lesson, studyRows) {\n  const configured = new Map((Array.isArray(lesson.drillPlan) ? lesson.drillPlan : [])\n    .map((entry) => [entry.sentenceId, entry.mode]));\n  const primary = studyRows.map((row) => ({\n    sentenceId: row.id,\n    mode: normalizeSentenceLessonMode(row, configured.get(row.id)),\n  }));', 'function buildSentenceLessonQuestionPlan(lesson, studyRows) {\n  const configured = new Map((Array.isArray(lesson.drillPlan) ? lesson.drillPlan : [])\n    .filter((entry) => entry && typeof entry.sentenceId === "string")\n    .map((entry) => [entry.sentenceId, entry]));\n  const primary = studyRows.map((row) => {\n    const configuredEntry = configured.get(row.id) || {};\n    return {\n      sentenceId: row.id,\n      mode: normalizeSentenceLessonMode(row, configuredEntry.mode),\n      promptEn: typeof configuredEntry.promptEn === "string" ? configuredEntry.promptEn : "",\n      cueLabel: typeof configuredEntry.cueLabel === "string" ? configuredEntry.cueLabel : "",\n      teachingPhase: typeof configuredEntry.teachingPhase === "string" ? configuredEntry.teachingPhase : "",\n    };\n  });')
          replace_once('app.js', '  const tagTips = (lesson.patternTags || [])\n    .map((tag) => getSentencePatternTip(tag))\n    .filter(Boolean)\n    .slice(0, 4)\n    .map((tip) => `<li>${escapeHtml(tip)}</li>`)\n    .join("");\n  return `', '  const tagTips = (lesson.patternTags || [])\n    .map((tag) => getSentencePatternTip(tag))\n    .filter(Boolean)\n    .slice(0, 4)\n    .map((tip) => `<li>${escapeHtml(tip)}</li>`)\n    .join("");\n  const contrastUi = window.HANAPATH_SENTENCE_CONTRAST_UI;\n  const contrastGuide = contrastUi && typeof contrastUi.renderIntroGuide === "function"\n    ? contrastUi.renderIntroGuide(lesson.contrastTeaching, escapeHtml)\n    : "";\n  return `')
          replace_once('app.js', '      <div class="screen-sub" style="margin-bottom:12px;">${escapeHtml(lesson.concept || "")}</div>\n      ${tagTips ? `<ul class="ss-tip-list">${tagTips}</ul>` : ""}', '      <div class="screen-sub" style="margin-bottom:12px;">${escapeHtml(lesson.concept || "")}</div>\n      ${contrastGuide}\n      ${tagTips ? `<ul class="ss-tip-list">${tagTips}</ul>` : ""}')
          replace_once('app.js', '  const studyRows = session.studyRows || session.rows;\n  const row = studyRows[session.studyIndex];\n  const total = studyRows.length;\n  return `', '  const studyRows = session.studyRows || session.rows;\n  const row = studyRows[session.studyIndex];\n  const total = studyRows.length;\n  const lesson = session.lessonId ? getSentenceLessonById(session.lessonId) : null;\n  const contrastUi = window.HANAPATH_SENTENCE_CONTRAST_UI;\n  const contrastStudyNote = contrastUi && typeof contrastUi.renderStudyNote === "function"\n    ? contrastUi.renderStudyNote(lesson?.contrastTeaching, row.id, escapeHtml)\n    : "";\n  return `')
          replace_once('app.js', '      <div class="screen-sub" style="margin:14px 0;">${escapeHtml(row.english)}</div>\n      <div class="word-card-actions word-card-nav-actions">', '      <div class="screen-sub" style="margin:14px 0;">${escapeHtml(row.english)}</div>\n      ${contrastStudyNote}\n      <div class="word-card-actions word-card-nav-actions">')
          replace_once('app.js', 'function sentenceQuestionHtml(session) {\n  const row = session.rows[session.index];\n  const mode = sentenceQuestionMode(session);\n\n  let innerContent = "";', 'function getSentenceLessonDrillEntry(session) {\n  if (!session || session.modeId !== "lesson") return null;\n  const entry = session.drillPlan?.[session.index];\n  return entry && typeof entry === "object" ? entry : null;\n}\n\nfunction sentenceLessonPromptText(session, row) {\n  const contrastUi = window.HANAPATH_SENTENCE_CONTRAST_UI;\n  if (contrastUi && typeof contrastUi.promptForDrill === "function") {\n    return contrastUi.promptForDrill(getSentenceLessonDrillEntry(session), row?.english || "");\n  }\n  return row?.english || "";\n}\n\nfunction sentenceLessonCueLabel(session, fallback) {\n  const contrastUi = window.HANAPATH_SENTENCE_CONTRAST_UI;\n  if (contrastUi && typeof contrastUi.labelForDrill === "function") {\n    return contrastUi.labelForDrill(getSentenceLessonDrillEntry(session), fallback);\n  }\n  return fallback;\n}\n\nfunction sentenceQuestionHtml(session) {\n  const row = session.rows[session.index];\n  const mode = sentenceQuestionMode(session);\n  const lessonPrompt = sentenceLessonPromptText(session, row);\n\n  let innerContent = "";')
          replace_once('app.js', '      ${sentencePromptTileHtml(`<div class="sentence-prompt-text">${escapeHtml(row.english)}</div>`, "is-english")}\n      ${sentenceModeMetaHtml(row, "Translate & Type")}', '      ${sentencePromptTileHtml(`<div class="sentence-prompt-text">${escapeHtml(lessonPrompt)}</div>`, "is-english")}\n      ${sentenceModeMetaHtml(row, sentenceLessonCueLabel(session, "Translate & Type"))}')
          replace_once('app.js', '      ${sentencePromptTileHtml(`<div class="sentence-prompt-text">${escapeHtml(row.english)}</div>`, "is-english")}\n      ${sentenceModeMetaHtml(row, "Word Builder")}', '      ${sentencePromptTileHtml(`<div class="sentence-prompt-text">${escapeHtml(lessonPrompt)}</div>`, "is-english")}\n      ${sentenceModeMetaHtml(row, sentenceLessonCueLabel(session, "Word Builder"))}')
          replace_once('index.html', '    <script defer src="./sentences_core.js?v=20260717u"></script>\n    <script defer src="./sentences_lesson_plan.js?v=20260717u"></script>', '    <script defer src="./sentences_core.js?v=20260717u"></script>\n    <script defer src="./sentences_lesson_plan.js?v=20260717u"></script>\n    <script defer src="./sentence_lesson_contrast_ui.js?v=20260726a"></script>\n    <script defer src="./sentence_lesson_contrasts_sections_1_4.js?v=20260726a"></script>')
          replace_once('index.html', '    <script defer src="./app.js?v=20260725a"></script>', '    <script defer src="./app.js?v=20260726a"></script>')
          replace_once('sw.js', '// [2026-07-25] Cache bumped for E0 Sentence-eligibility sharding (four new browser-loaded shard files + merger).\nconst CACHE_NAME = "hanapath-shell-v449";', '// [2026-07-26] Cache bumped for CB2 Sentence lesson contrast teaching (shared UI + sections 1-4 data + app prompt support).\nconst CACHE_NAME = "hanapath-shell-v450";')
          replace_once('sw.js', '  "./sentences_core.js?v=20260717u",\n  "./sentences_lesson_plan.js?v=20260717u",', '  "./sentences_core.js?v=20260717u",\n  "./sentences_lesson_plan.js?v=20260717u",\n  "./sentence_lesson_contrast_ui.js?v=20260726a",\n  "./sentence_lesson_contrasts_sections_1_4.js?v=20260726a",')
          replace_once('sw.js', '  "./app.js?v=20260725a",', '  "./app.js?v=20260726a",')
          replace_once('scripts/audit-app-shell.mjs', '  "./raw_word_meanings.js",\n  "./sentences_core.js",\n  "./app.js",', '  "./raw_word_meanings.js",\n  "./sentences_core.js",\n  "./sentence_lesson_contrast_ui.js",\n  "./sentence_lesson_contrasts_sections_1_4.js",\n  "./app.js",')
          replace_once('.github/workflows/ci.yml', '          for f in app.js sw.js exam_integrity.js sentence_exam_eligibility.js sentence_exam_prompt_templates.js sentence_exam_curated_bank.js sentence_exam_grader.js words_lesson_plan.js; do', '          for f in app.js sw.js exam_integrity.js sentence_exam_eligibility.js sentence_exam_prompt_templates.js sentence_exam_curated_bank.js sentence_exam_grader.js sentence_lesson_contrast_ui.js sentence_lesson_contrasts_sections_1_4.js words_lesson_plan.js; do')
          replace_once('.github/workflows/ci.yml', '      - name: Check CB1 inventory and shortlist freshness\n        run: node scripts/build-sentence-exam-inventory.mjs --check\n', '      - name: Check CB1 inventory and shortlist freshness\n        run: node scripts/build-sentence-exam-inventory.mjs --check\n      - name: Sentence lesson contrast authoring regression\n        run: node scripts/test-sentence-lesson-contrast-authoring.mjs\n      - name: Sentence lesson contrast UI regression\n        run: node scripts/test-sentence-lesson-contrast-ui.mjs\n      - name: Check CB2 lesson contrast freshness\n        run: node scripts/build-sentence-lesson-contrasts.mjs --check\n      - name: Audit CB2 lesson contrast coverage and safety\n        run: node scripts/audit-sentence-lesson-contrasts.mjs\n      - name: Sentence lesson contrast browser fixtures\n        run: node scripts/test-sentence-lesson-contrasts-browser.mjs\n')
          replace_once('scripts/audit-core-release.mjs', '  { id: "sentence-exam-inventory", label: "Sentence-exam inventory and shortlist freshness (CB1)", script: "scripts/build-sentence-exam-inventory.mjs", fullArgs: ["--check"], quickArgs: ["--check"] },\n  {', '  { id: "sentence-exam-inventory", label: "Sentence-exam inventory and shortlist freshness (CB1)", script: "scripts/build-sentence-exam-inventory.mjs", fullArgs: ["--check"], quickArgs: ["--check"] },\n  { id: "sentence-lesson-contrast-authoring", label: "Sentence lesson contrast authoring regression (CB2)", script: "scripts/test-sentence-lesson-contrast-authoring.mjs" },\n  { id: "sentence-lesson-contrast-ui", label: "Sentence lesson contrast UI regression (CB2)", script: "scripts/test-sentence-lesson-contrast-ui.mjs" },\n  { id: "sentence-lesson-contrast-freshness", label: "Sentence lesson contrast data freshness (CB2)", script: "scripts/build-sentence-lesson-contrasts.mjs", fullArgs: ["--check"], quickArgs: ["--check"] },\n  { id: "sentence-lesson-contrasts", label: "Sentence lesson contrast coverage and safety (CB2)", script: "scripts/audit-sentence-lesson-contrasts.mjs" },\n  { id: "sentence-lesson-contrast-browser", label: "Sentence lesson contrast browser fixtures (CB2)", script: "scripts/test-sentence-lesson-contrasts-browser.mjs" },\n  {')
      - name: Generate deterministic contrast contracts
        run: node scripts/build-sentence-lesson-contrasts.mjs --write
      - name: Run focused CB2 validation
        run: |
          node --check app.js
          node --check sw.js
          node --check sentence_lesson_contrast_ui.js
          node --check sentence_lesson_contrasts_sections_1_4.js
          node --check scripts/build-sentence-lesson-contrasts.mjs
          node --check scripts/lib/sentence-lesson-contrast-authoring.mjs
          node --check scripts/audit-sentence-lesson-contrasts.mjs
          node --check scripts/test-sentence-lesson-contrast-authoring.mjs
          node --check scripts/test-sentence-lesson-contrast-ui.mjs
          node --check scripts/test-sentence-lesson-contrasts-browser.mjs
          node scripts/test-sentence-lesson-contrast-authoring.mjs
          node scripts/test-sentence-lesson-contrast-ui.mjs
          node scripts/build-sentence-lesson-contrasts.mjs --check
          node scripts/audit-sentence-lesson-contrasts.mjs
          node scripts/test-sentence-lesson-contrasts-browser.mjs
          node scripts/audit-app-shell.mjs
      - name: Refresh deterministic core status
        run: node scripts/audit-core-release.mjs --write-status
      - name: Commit CB2 generated and wired implementation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            app.js index.html sw.js \
            sentence_lesson_contrasts_sections_1_4.js \
            docs/generated/sentence_lesson_contrasts_sections_1_4.json \
            docs/CORE_APP_STATUS.md \
            scripts/audit-app-shell.mjs \
            scripts/audit-core-release.mjs
          if git diff --cached --quiet; then
            echo "CB2 generated contracts and wiring already current."
            exit 0
          fi
          git commit -m "CB2: wire and generate sections 1-4 lesson contrasts"
          git push origin "HEAD:${HEAD_BRANCH}"
