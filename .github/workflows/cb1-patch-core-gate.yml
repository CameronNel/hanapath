name: CB1 Patch Core Gate

on:
  pull_request:
    paths:
      - ".github/workflows/cb1-patch-core-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: Wire CB1 into core gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Patch core gate deterministically
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/audit-core-release.mjs")
          text = path.read_text()
          needle = '  { id: "sentence-exam-grader", label: "Sentence-exam strict grader regression (CB0)", script: "scripts/test-sentence-exam-grader.mjs" },\n'
          addition = (
              needle
              + '  { id: "sentence-exam-candidate-ranking", label: "Sentence-exam candidate ranking regression (CB1)", script: "scripts/test-sentence-exam-candidate-ranking.mjs" },\n'
              + '  { id: "sentence-exam-inventory", label: "Sentence-exam inventory and shortlist freshness (CB1)", script: "scripts/build-sentence-exam-inventory.mjs", fullArgs: ["--check"], quickArgs: ["--check"] },\n'
          )
          if addition in text:
              print("Core gate already patched.")
          elif needle not in text:
              raise SystemExit("Expected CB0 grader gate anchor not found.")
          else:
              path.write_text(text.replace(needle, addition, 1))
          PY
      - name: Commit core-gate wiring
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-core-release.mjs
          if git diff --cached --quiet; then
            echo "Core gate already current."
            exit 0
          fi
          git commit -m "CB1: wire inventory checks into core gate"
          git push origin "HEAD:${HEAD_BRANCH}"
