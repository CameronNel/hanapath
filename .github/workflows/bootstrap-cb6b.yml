name: bootstrap-cb6b-controlled-clause-reauthor

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore halted CB6 authoring packet
        run: |
          git fetch origin d0362bce11679ddd272a6413bfa821caf68e7ad8
          git checkout d0362bce11679ddd272a6413bfa821caf68e7ad8 -- \
            scripts/build-sentence-exam-capacity-remediation.mjs \
            scripts/audit-sentence-exam-capacity-remediation.mjs \
            scripts/test-sentence-exam-capacity-remediation.mjs \
            docs/generated/sentence_exam_cb6_capacity_authoring.json \
            docs/generated/sentence_exam_cb6_capacity_witness.json \
            docs/reviews/sentence_exam_cb6_capacity_reviews.json \
            docs/reviews/sentence_exam_cb6_capacity_review_guide.md
      - name: Generate exact CB6B typed-row classification report
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_authoring.json', 'utf8'));
          const clauseTags = new Set([
            'and-go', 'because-aseo', 'if-myeon', 'when-ttae',
            'but-jiman', 'want-go-sipda', 'propositive-eyo',
          ]);
          const typed = input.entries.filter((entry) => entry.mode === 'typed').map((entry) => {
            const carriedClauseTags = entry.patternTags.filter((tag) => clauseTags.has(tag));
            const particleFlag = entry.ambiguityFlags.includes('particle-or-order-family');
            return {
              id: entry.id,
              sourceSectionOrder: entry.sourceSectionOrder,
              sourceLessonIds: entry.sourceLessonIds,
              canonicalAnswer: entry.canonicalAnswer,
              englishMeaning: entry.englishMeaning,
              patternTags: entry.patternTags,
              ambiguityFlags: entry.ambiguityFlags,
              clauseTags: carriedClauseTags,
              classification: carriedClauseTags.length
                ? (particleFlag ? 'clause+particle' : 'clause-only')
                : (particleFlag ? 'particle-only' : 'ordinary-clean'),
              existingExamPromptEn: entry.existingExamPromptEn,
              originalWitnessUses: [],
            };
          });
          const witness = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_witness.json', 'utf8'));
          for (const [examId, attempts] of Object.entries(witness.exams)) {
            attempts.forEach((attempt, attemptIndex) => {
              for (const selected of attempt) {
                const row = typed.find((entry) => entry.id === selected.id);
                if (row) row.originalWitnessUses.push({ examId, attempt: attemptIndex + 1, strand: selected.strand });
              }
            });
          }
          const counts = Object.fromEntries([...new Set(typed.map((entry) => entry.classification))]
            .sort().map((key) => [key, typed.filter((entry) => entry.classification === key).length]));
          const report = {
            schemaVersion: 1,
            revision: 'curated-sentence-exam-v2-cb6b-classification',
            sourceHead: 'd0362bce11679ddd272a6413bfa821caf68e7ad8',
            counts,
            typed,
          };
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_typed_classification.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(counts));
          NODE
      - name: Commit clean bootstrap
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/bootstrap-cb6b.yml
          git add scripts docs
          git diff --cached --check
          git commit -m "CB6B: bootstrap controlled-clause reauthoring"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
