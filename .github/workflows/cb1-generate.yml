name: CB1 Generate

on:
  pull_request:
    paths:
      - ".github/workflows/cb1-generate.yml"
      - "scripts/build-sentence-exam-inventory.mjs"
      - "scripts/lib/sentence-exam-ambiguity.mjs"
      - "scripts/lib/sentence-exam-candidate-ranking.mjs"
      - "scripts/test-sentence-exam-candidate-ranking.mjs"
      - "sentences_core.js"
      - "sentences_lesson_plan.js"
      - "sentence_exam_eligibility*.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate CB1 inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generator syntax
        run: |
          node --check scripts/build-sentence-exam-inventory.mjs
          node --check scripts/lib/sentence-exam-candidate-ranking.mjs
          node --check scripts/test-sentence-exam-candidate-ranking.mjs
      - name: Run candidate-ranking regression
        run: node scripts/test-sentence-exam-candidate-ranking.mjs
      - name: Generate live inventory and shortlist
        run: node scripts/build-sentence-exam-inventory.mjs --write
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: cb1-sentence-exam-inventory
          path: |
            docs/generated/sentence_exam_inventory.json
            docs/generated/sentence_exam_shortlist.json
          if-no-files-found: error
      - name: Commit generated files to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/sentence_exam_inventory.json docs/generated/sentence_exam_shortlist.json
          if git diff --cached --quiet; then
            echo "Generated files already current."
            exit 0
          fi
          git commit -m "CB1: check in generated inventory and shortlist"
          git push origin "HEAD:${HEAD_BRANCH}"
