name: annotate-cb6b-copula-origins

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bank and authoring membership
        run: |
          node <<'NODE'
          const fs=require('node:fs'); const vm=require('node:vm');
          const path='docs/generated/sentence_exam_cb6b_copula_swap_analysis.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const authoring=JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_authoring.json','utf8'));
          const sandbox={window:{}}; sandbox.self=sandbox.window; sandbox.globalThis=sandbox.window; vm.createContext(sandbox);
          for(const file of ['sentence_exam_curated_bank.js','sentence_exam_curated_bank_freeze.js']) vm.runInContext(fs.readFileSync(file,'utf8'),sandbox,{filename:file});
          const bankById=new Map(sandbox.window.HANAPATH_SENTENCE_EXAM_CURATED_BANK.entries.map(e=>[e.id,e.mode]));
          const authoringById=new Map(authoring.entries.map(e=>[e.id,e.mode]));
          for(const row of data.candidates){row.bankMode=bankById.get(row.id)||null; row.authoringMode=authoringById.get(row.id)||null;}
          fs.writeFileSync(path,`${JSON.stringify(data,null,2)}\n`);
          NODE
      - name: Commit and remove workflow
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/annotate-cb6b-copula-origins.yml
          git add docs/generated/sentence_exam_cb6b_copula_swap_analysis.json
          git diff --cached --check
          git commit -m "CB6B: annotate copula candidate origins"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
