name: Temporary CB6 packet publication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'core/cb6-sentence-bank-capacity-refreeze'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CB6 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize permanent CB6 packet
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cb6-packet.part* > /tmp/cb6-packet.b64
          base64 --decode /tmp/cb6-packet.b64 > /tmp/cb6-packet.tar.gz
          tar -xzf /tmp/cb6-packet.tar.gz

          node --check scripts/build-sentence-exam-capacity-remediation.mjs
          node --check scripts/audit-sentence-exam-capacity-remediation.mjs
          node --check scripts/test-sentence-exam-capacity-remediation.mjs
          node scripts/test-sentence-exam-capacity-remediation.mjs
          node scripts/audit-sentence-exam-capacity-remediation.mjs

      - name: Commit permanent packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build-sentence-exam-capacity-remediation.mjs \
            scripts/audit-sentence-exam-capacity-remediation.mjs \
            scripts/test-sentence-exam-capacity-remediation.mjs \
            docs/generated/sentence_exam_cb6_capacity_authoring.json \
            docs/generated/sentence_exam_cb6_capacity_witness.json \
            docs/reviews/sentence_exam_cb6_capacity_reviews.json \
            docs/reviews/sentence_exam_cb6_capacity_review_guide.md
          if git diff --cached --quiet; then
            echo "Permanent CB6 packet is already current."
            exit 0
          fi
          git commit -m "CB6: add capacity remediation authoring packet"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
