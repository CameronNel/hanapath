name: fix-cb6a-inventory-stability

on:
  push:
    branches:
      - core/cb6a-controlled-clause-contract

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolate controlled prompts from generic inventory heuristics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/lib/sentence-exam-ambiguity.mjs')
          s = p.read_text()
          s = s.replace(
            r'''const TIME_CUE_RE = /\b(yesterday|today|tomorrow|tonight|this morning|this afternoon|this evening|last night|last week|next week|right now|soon|later|every day|each week|on (?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)|at \d{1,2}(?::\d{2})?|(?:keep|preserve) the (?:supplied )?tense)\b/i;
          const REGISTER_CUE_RE = /\b(formal|informal|politely|respectfully|casually|to (?:a|your) (?:classmate|friend|teacher|boss|elder|judge|customer|child)|in polite formal style|in polite style|(?:keep|preserve) the (?:supplied )?(?:speech level|register))\b/i;
          const TOPIC_CUE_RE = /\b(as for|regarding|speaking of|in contrast to|(?:keep|preserve) the (?:supplied )?(?:information structure|topic\/subject marking))\b/i;
          const FOCUS_CUE_RE = /\b(answer(?:ing)? (?:the question )?["“']?(?:who|what|which)|the one who|the thing that|it is .+ that)\b/i;
          const LEXICAL_CUE_RE = /\b((?:using|use) (?:the word|the expression|the verb|the noun|the adjective)|(?:keep|preserve) the supplied Korean (?:wording|lexical material))\b/i;
          const COMMUNICATIVE_ACT_RE = /\b(tell|ask|request|invite|suggest|thank|apologise|apologize|warn|promise|answer|say|combine|join|recast|transform|change)\b/i;''',
            r'''const TIME_CUE_RE = /\b(yesterday|today|tomorrow|tonight|this morning|this afternoon|this evening|last night|last week|next week|right now|soon|later|every day|each week|on (?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)|at \d{1,2}(?::\d{2})?)\b/i;
          const REGISTER_CUE_RE = /\b(formal|informal|politely|respectfully|casually|to (?:a|your) (?:classmate|friend|teacher|boss|elder|judge|customer|child)|in polite formal style|in polite style)\b/i;
          const TOPIC_CUE_RE = /\b(as for|regarding|speaking of|in contrast to)\b/i;
          const FOCUS_CUE_RE = /\b(answer(?:ing)? (?:the question )?["“']?(?:who|what|which)|the one who|the thing that|it is .+ that)\b/i;
          const LEXICAL_CUE_RE = /\b(using|use) (?:the word|the expression|the verb|the noun|the adjective)\b/i;
          const COMMUNICATIVE_ACT_RE = /\b(tell|ask|request|invite|suggest|thank|apologise|apologize|warn|promise|answer|say)\b/i;'''
          )
          s = s.replace('if (hasTopicOrSubject && !TOPIC_CUE_RE.test(prompt) && !FOCUS_CUE_RE.test(prompt)) {', 'if (hasTopicOrSubject && !controlledClause.valid && !TOPIC_CUE_RE.test(prompt) && !FOCUS_CUE_RE.test(prompt)) {')
          s = s.replace('if (tenseSensitive && !TIME_CUE_RE.test(prompt)) {', 'if (tenseSensitive && !controlledClause.valid && !TIME_CUE_RE.test(prompt)) {')
          s = s.replace('if (registerSensitive && !REGISTER_CUE_RE.test(prompt)) {', 'if (registerSensitive && !controlledClause.valid && !REGISTER_CUE_RE.test(prompt)) {')
          s = s.replace('if (!COMMUNICATIVE_ACT_RE.test(prompt)) {', 'if (!controlledClause.valid && !COMMUNICATIVE_ACT_RE.test(prompt)) {')
          s = s.replace('if (options.requiresLexicalAnchor === true && !LEXICAL_CUE_RE.test(prompt)) {', 'if (options.requiresLexicalAnchor === true && !controlledClause.valid && !LEXICAL_CUE_RE.test(prompt)) {')
          p.write_text(s)
          PY
      - name: Validate stable inventory and full CB6A contract
        run: |
          node --check scripts/lib/sentence-exam-ambiguity.mjs
          node scripts/build-sentence-exam-inventory.mjs --check
          node scripts/test-sentence-exam-ambiguity.mjs
          node scripts/audit-sentence-exam-curated-bank.mjs
          node scripts/test-sentence-exam-grader.mjs
          node scripts/test-sentence-exam-curated-bank-cb4.mjs
          node scripts/test-sentence-exam-curated-bank-freeze.mjs
          node scripts/build-sentence-exam-curated-bank.mjs --check
          node scripts/build-sentence-exam-curated-bank-freeze.mjs --check
      - name: Commit permanent fix
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/fix-cb6a-inventory-stability.yml
          git add scripts/lib/sentence-exam-ambiguity.mjs
          git diff --cached --check
          git commit -m "CB6A: preserve generic inventory heuristics"
          git push origin HEAD:core/cb6a-controlled-clause-contract
