name: search-cb6b-exact-cap-safe

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find candidates using live inventory routes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const inventoryDoc = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_inventory.json', 'utf8'));
          const inventory = inventoryDoc.inventory;
          const byId = new Map(inventory.map((row) => [row.id, row]));
          const authoring = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_authoring.json', 'utf8'));
          const mappings = JSON.parse(fs.readFileSync('docs/authoring/sentence_exam_cb6b_replacements.json', 'utf8')).mappings;
          const replacementIds = new Set(mappings.map((item) => item.replacementId));
          const sandbox = { window: {} };
          sandbox.self = sandbox.window;
          sandbox.globalThis = sandbox.window;
          vm.createContext(sandbox);
          for (const file of ['sentence_exam_curated_bank.js','sentence_exam_curated_bank_freeze.js']) vm.runInContext(fs.readFileSync(file,'utf8'), sandbox, { filename:file });
          const bank = sandbox.window.HANAPATH_SENTENCE_EXAM_CURATED_BANK;
          const occupiedIds = new Set([
            ...bank.entries.map((entry) => entry.id),
            ...authoring.entries.filter((entry) => !replacementIds.has(entry.id)).map((entry) => entry.id),
          ]);
          const usedTypedLessons = new Set();
          for (const entry of bank.entries.filter((entry) => entry.mode === 'typed')) {
            for (const lesson of byId.get(entry.id)?.lessonIds || []) usedTypedLessons.add(lesson);
          }
          for (const entry of authoring.entries.filter((entry) => entry.mode === 'typed' && !replacementIds.has(entry.id))) {
            for (const lesson of byId.get(entry.id)?.lessonIds || []) usedTypedLessons.add(lesson);
          }
          const specs = {
            but: { maxSection:2, tags:['but-jiman'] },
            want: { maxSection:2, tags:['want-go-sipda'] },
            when: { maxSection:6, tags:['when-ttae'] },
            formalHonorific: { maxSection:8, tags:['formal-nida','honorific-si'] },
            can: { maxSection:6, tags:['can-su-itda'] },
            copulaNegative: { maxSection:8, tags:['copula-negative-anieyo'] },
            future: { maxSection:8, tags:['future-geoyeyo'] },
            formal: { maxSection:8, tags:['formal-nida'] },
            negMot: { maxSection:8, tags:['neg-mot'] },
          };
          const report = { usedTypedLessons: [...usedTypedLessons].sort(), groups: {} };
          for (const [name,spec] of Object.entries(specs)) {
            report.groups[name] = inventory.filter((row) => !occupiedIds.has(row.id)
              && Number(row.candidateAssessment?.primarySection || row.sectionOrders?.[0]) <= spec.maxSection
              && spec.tags.every((tag) => (row.patternTags || []).includes(tag))
              && !(row.lessonIds || []).some((lesson) => usedTypedLessons.has(lesson)))
              .map((row) => ({
                id: row.id,
                section: Number(row.candidateAssessment?.primarySection || row.sectionOrders?.[0]),
                korean: row.korean,
                english: row.english,
                tags: row.patternTags,
                flags: row.ambiguityFlags,
                lessons: row.lessonIds,
              }))
              .sort((a,b) => a.section-b.section || a.flags.length-b.flags.length || a.id.localeCompare(b.id))
              .slice(0,60);
          }
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_exact_cap_safe_search.json', `${JSON.stringify({schemaVersion:1,report},null,2)}\n`);
          NODE
      - name: Commit report and remove workflow
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/search-cb6b-exact-cap-safe.yml
          git add docs/generated/sentence_exam_cb6b_exact_cap_safe_search.json
          git diff --cached --check
          git commit -m "CB6B: search exact lesson-cap-safe candidates"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
