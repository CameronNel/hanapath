name: CB2 Fix Generation Workflow

on:
  pull_request:
    paths:
      - ".github/workflows/cb2-fix-generation-workflow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    name: Correct CB2 patch context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Correct exact app source context
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/cb2-generate-and-validate.yml')
          text = path.read_text(encoding='utf-8')
          old = '.map((tag) => getSentencePatternTip(tag))'
          new = '.map((tag) => PATTERN_TAG_INFO[tag])'
          if old in text:
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected CB2 workflow source context not found')
          PY
      - name: Commit corrected workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cb2-generate-and-validate.yml
          if git diff --cached --quiet; then
            echo "Workflow already corrected."
            exit 0
          fi
          git commit -m "chore: correct CB2 generator patch context"
          git push origin "HEAD:${HEAD_BRANCH}"
