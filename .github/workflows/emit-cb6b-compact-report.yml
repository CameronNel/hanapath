name: emit-cb6b-compact-report

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write compact authoring report
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6b_typed_classification.json', 'utf8'));
          const rows = report.typed.filter((row) => row.classification !== 'ordinary-clean');
          const lines = rows.map((row) => JSON.stringify({
            id: row.id,
            section: row.sourceSectionOrder,
            classification: row.classification,
            korean: row.canonicalAnswer,
            english: row.englishMeaning,
            tags: row.patternTags,
            flags: row.ambiguityFlags,
            uses: row.originalWitnessUses,
          }));
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_nonordinary_rows.jsonl', `${lines.join('\n')}\n`);
          NODE
      - name: Commit report and remove workflow
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/emit-cb6b-compact-report.yml
          git add docs/generated/sentence_exam_cb6b_nonordinary_rows.jsonl
          git diff --cached --check
          git commit -m "CB6B: expose nonordinary authoring rows"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
