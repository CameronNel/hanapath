name: CB1 Regenerate

on:
  pull_request:
    paths:
      - ".github/workflows/cb1-regenerate.yml"
      - "scripts/build-sentence-exam-inventory.mjs"
      - "scripts/lib/sentence-exam-candidate-ranking.mjs"
      - "scripts/test-sentence-exam-candidate-ranking.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate lesson-diverse shortlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate selector
        run: |
          node --check scripts/lib/sentence-exam-candidate-ranking.mjs
          node --check scripts/test-sentence-exam-candidate-ranking.mjs
          node scripts/test-sentence-exam-candidate-ranking.mjs
      - name: Regenerate contracts
        run: node scripts/build-sentence-exam-inventory.mjs --write
      - name: Commit generated contracts
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/sentence_exam_inventory.json docs/generated/sentence_exam_shortlist.json
          if git diff --cached --quiet; then
            echo "Generated contracts already current."
            exit 0
          fi
          git commit -m "CB1: regenerate lesson-diverse candidate shortlist"
          git push origin "HEAD:${HEAD_BRANCH}"
