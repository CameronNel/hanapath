name: CI

on:
  pull_request:
  push:
    branches: [main, exec/workstream-0-box-0b]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect Workstream 0 Box 0B paths
        shell: bash
        run: |
          echo '=== relevant symbols ==='
          grep -n -C 25 -E 'TEST_ENABLE_WORD_SECTION_COMPLETION|__wetest|completeWordSectionForTesting|word-section-completion|Complete section|complete section' app.js || true
          echo '=== save/load/export/import symbols ==='
          grep -n -C 12 -E 'function saveState|function loadState|export.*backup|import.*backup|download.*backup|restore.*backup' app.js || true
          echo '=== app shell versions ==='
          grep -n -E 'CACHE_NAME|exam_integrity.js|app.js\?v=' sw.js index.html

      - name: Check app syntax
        run: node --check app.js

      - name: Audit alphabet audio coverage
        run: node scripts/audit-alphabet-audio.mjs --strict
