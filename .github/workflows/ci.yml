name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-gate:
    name: Core-release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # mobile/www is intentionally generated and ignored. Prepare it from the
      # exact checked-out static app so mobile-package validation is blocking
      # in the same release matrix instead of becoming a permitted CI skip.
      - name: Prepare isolated mobile web payload
        run: node mobile/scripts/prepare-web.mjs

      # The single deterministic superset gate covers every roadmap §9 family,
      # real browser journeys, migrations, the prepared mobile payload, and the
      # generated status report. Q2 permits no conditional or skipped steps.
      - name: Run strict full core-release gate
        run: node scripts/audit-core-release.mjs --full
