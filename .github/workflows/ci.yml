name: CI

on:
  pull_request:
  push:
    branches: [main, exec/workstream-0-box-0b]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture Workstream 0 Box 0B paths
        shell: bash
        run: |
          {
            echo '=== relevant symbols ==='
            grep -n -C 30 -E 'TEST_ENABLE_WORD_SECTION_COMPLETION|__wetest|completeWordSectionForTesting|word-section-completion|Complete section|complete section' app.js || true
            echo '=== save/load/export/import symbols ==='
            grep -n -C 16 -E 'function saveState|function loadState|export.*backup|import.*backup|download.*backup|restore.*backup' app.js || true
            echo '=== app shell versions ==='
            grep -n -E 'CACHE_NAME|exam_integrity.js|app.js\?v=' sw.js index.html
          } > WS0B_INSPECT.txt
          cat WS0B_INSPECT.txt

      - name: Publish inspection file
        if: github.actor != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: exec/workstream-0-box-0b
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 WS0B_INSPECT.txt)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/WS0B_INSPECT.txt" \
            -f message='Record Workstream 0 gate inspection' \
            -f content="$encoded" \
            -f branch="$BRANCH_NAME" >/dev/null

      - name: Check app syntax
        run: node --check app.js

      - name: Audit alphabet audio coverage
        run: node scripts/audit-alphabet-audio.mjs --strict
