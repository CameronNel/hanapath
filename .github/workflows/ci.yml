name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Syntax-check every hand-edited runtime/data file the megabatch touches.
      # NOTE: `node --check` only checks its first filename argument, so each
      # file must be checked in its own invocation.
      - name: Check syntax
        run: |
          for f in app.js sw.js exam_integrity.js sentence_exam_eligibility.js sentence_exam_prompt_templates.js sentence_exam_curated_bank.js sentence_exam_grader.js sentence_lesson_contrast_ui.js sentence_lesson_contrasts_sections_1_4.js sentence_lesson_contrasts_sections_5_8.js words_lesson_plan.js; do
            echo "node --check $f"
            node --check "$f"
          done

      # Exam programme + integrity gate.
      - name: Audit exam integrity
        run: node scripts/audit-exam-integrity.mjs
      - name: Audit Hangul Mastery exam
        run: node scripts/audit-hangul-mastery-exam.mjs
      - name: Check word-exam competency map
        run: node scripts/build-word-exam-competency-map.mjs --check
      - name: Audit word exams
        run: node scripts/audit-word-exams.mjs

      # Learning-data gate (mirrors the Android workflow's learning-data step).
      - name: Audit words data
        run: node scripts/audit-words-data.mjs --strict
      - name: Thin-lesson heuristic regression
        run: node scripts/test-thin-lesson-heuristic.mjs
      - name: Audit sentences data
        run: node scripts/audit-sentences-data.mjs --strict
      - name: Audit form checks
        run: node scripts/audit-form-checks.mjs
      # The historical full-corpus eligibility audit remains active during the
      # curated-bank migration so the 2,100 completed reviews stay protected.
      - name: Audit sentence eligibility (schema + progress)
        run: node scripts/audit-sentence-eligibility.mjs --allow-incomplete
      - name: Audit curated sentence exam bank
        run: node scripts/audit-sentence-exam-curated-bank.mjs
      - name: Sentence exam ambiguity regression
        run: node scripts/test-sentence-exam-ambiguity.mjs
      - name: Sentence exam grader regression
        run: node scripts/test-sentence-exam-grader.mjs
      - name: Sentence exam candidate-ranking regression
        run: node scripts/test-sentence-exam-candidate-ranking.mjs
      - name: Check CB1 inventory and shortlist freshness
        run: node scripts/build-sentence-exam-inventory.mjs --check
      - name: Sentence lesson contrast authoring regression
        run: node scripts/test-sentence-lesson-contrast-authoring.mjs
      - name: Sentence lesson contrast UI regression
        run: node scripts/test-sentence-lesson-contrast-ui.mjs
      - name: Check CB2 lesson contrast freshness
        run: node scripts/build-sentence-lesson-contrasts.mjs --check
      - name: Audit CB2 lesson contrast coverage and safety
        run: node scripts/audit-sentence-lesson-contrasts.mjs
      - name: Sentence lesson contrast browser fixtures
        run: node scripts/test-sentence-lesson-contrasts-browser.mjs
      - name: Check CB3 lesson contrast freshness
        run: node scripts/build-sentence-lesson-contrasts-sections-5-8.mjs --check
      - name: Audit CB3 lesson contrast coverage and safety
        run: node scripts/audit-sentence-lesson-contrasts-sections-5-8.mjs
      - name: Sentence lesson contrast browser fixtures sections 5-8
        run: node scripts/test-sentence-lesson-contrasts-browser-sections-5-8.mjs

      # Alphabet / recognition / handwriting / shell gate.
      - name: Audit alphabet audio coverage
        run: node scripts/audit-alphabet-audio.mjs --strict
      - name: Audit Hangul recognition
        run: node scripts/audit-hangul-recognition.mjs
      - name: Audit premium handwriting
        run: node scripts/audit-premium-handwriting.mjs
      - name: Audit app shell
        run: node scripts/audit-app-shell.mjs

  core-gate:
    name: Core-release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Single deterministic superset gate (docs/CORE_APP_COMPLETION_ROADMAP.md
      # packet C1). Runs the full required audit matrix, verifies the generated
      # status report is fresh, and exits non-zero on any child failure. The
      # mobile-package step SKIPs here (no prepared mobile/www); the Android
      # workflow performs that validation.
      - name: Run full core-release gate
        run: node scripts/audit-core-release.mjs --full
