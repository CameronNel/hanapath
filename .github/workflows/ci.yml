name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-e1b-review:
    if: github.event_name == 'pull_request' && github.head_ref == 'core/e1b-review-s1051-s2100'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout packet branch
        uses: actions/checkout@v4
        with:
          ref: core/e1b-review-s1051-s2100
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch reviewed metadata and generate corrected E1B shard
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/e1b-final-review.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const promptBefore = "s2049: 'Formally acknowledge an instruction with the lesson expression meaning “Understood”. Use 알겠습니다.',";
          const promptAfter = "s2049: 'Formally acknowledge an instruction with the formal lesson expression built from 알다, meaning that you understand.',";
          const reasonBefore = "  if (particleCount >= 3 || (row.tokens || []).length >= 6) {\n    reasons.push('productive-word-order-family');\n  }";
          const reasonAfter = "  if (particleCount >= 3) {\n    reasons.push('productive-word-order-family');\n  }";
          if (!source.includes(promptBefore)) throw new Error('Expected s2049 prompt was not found');
          if (!source.includes(reasonBefore)) throw new Error('Expected length-based reason proxy was not found');
          source = source.replace(promptBefore, promptAfter).replace(reasonBefore, reasonAfter);
          fs.writeFileSync(path, source);
          NODE
          node scripts/e1b-final-review.mjs

      - name: Run independent reviewer invariants
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const window = {};
          const sandbox = { window, self: window, globalThis: window };
          vm.createContext(sandbox);
          for (const file of ['sentences_core.js', 'sentence_exam_eligibility_shard_b.js']) {
            vm.runInContext(fs.readFileSync(file, 'utf8'), sandbox, { filename: file });
          }
          const bank = new Map(window.HANAPATH_SENTENCES.map((row) => [row.id, row]));
          const rows = window.HANAPATH_SENTENCE_EXAM_ELIGIBILITY_SHARDS.B.reviewedRows;
          const counts = { canonical: 0, finite: 0, excluded: 0 };
          const reasonCounts = {};
          const prompts = new Map();
          const targets = new Map();
          const errors = [];
          const normalize = (value) => String(value ?? '').normalize('NFC').trim().replace(/\s+/g, ' ');
          for (const [id, entry] of Object.entries(rows)) {
            const row = bank.get(id);
            if (!row) errors.push(`${id}: absent from bank`);
            if (entry.canonicalTargetKey !== normalize(row && row.korean)) errors.push(`${id}: canonical mismatch`);
            if (entry.examPromptEn.includes(entry.canonicalTargetKey)) errors.push(`${id}: full target leaks in prompt`);
            if ((row.patternTags || []).includes('future-geoyeyo') && entry.typedClass !== 'excluded') errors.push(`${id}: future row typed-eligible`);
            if (entry.typedClass === 'canonical' && entry.acceptedAnswers.length !== 1) errors.push(`${id}: canonical answer count`);
            if (entry.typedClass === 'finite' && (entry.acceptedAnswers.length < 2 || entry.acceptedAnswers.length > 5)) errors.push(`${id}: finite answer count`);
            if (entry.typedClass === 'excluded' && (!entry.exclusionReasons.length || entry.eligibleModes.includes('translate-type'))) errors.push(`${id}: excluded contract`);
            if (entry.typedClass !== 'excluded' && entry.exclusionReasons.length) errors.push(`${id}: eligible row has exclusion reasons`);
            counts[entry.typedClass] += 1;
            for (const reason of entry.exclusionReasons) reasonCounts[reason] = (reasonCounts[reason] || 0) + 1;
            prompts.set(entry.examPromptEn, [...(prompts.get(entry.examPromptEn) || []), id]);
            targets.set(entry.canonicalTargetKey, [...(targets.get(entry.canonicalTargetKey) || []), id]);
          }
          if (Object.keys(rows).length !== 1050) errors.push(`row count ${Object.keys(rows).length}`);
          if (counts.canonical !== 41 || counts.finite !== 8 || counts.excluded !== 1001) errors.push(`unexpected counts ${JSON.stringify(counts)}`);
          const expectedReasonCounts = {
            'connective-clause-continuation': 343,
            'lexical-or-information-structure-ambiguity': 375,
            'particle-or-word-order-ambiguity': 29,
            'productive-word-order-family': 290,
            'topic-subject-information-structure-ambiguity': 85,
            'future-authoring-locked': 8,
            'productive-pragmatic-variants': 58,
            'unsafe-existing-alternative-family': 7,
          };
          if (JSON.stringify(reasonCounts) !== JSON.stringify(expectedReasonCounts)) errors.push(`unexpected reason counts ${JSON.stringify(reasonCounts)}`);
          for (const [prompt, ids] of prompts) if (ids.length > 1) errors.push(`duplicate prompt ${ids.join(', ')}`);
          for (const [target, ids] of targets) if (ids.length > 1) errors.push(`duplicate target ${ids.join(', ')}`);
          if (errors.length) throw new Error(errors.join('\n'));
          console.log(JSON.stringify({ rowCount: 1050, counts, reasonCounts, promptLeaks: 0, duplicatePrompts: 0, duplicateTargets: 0, futureEligible: 0 }, null, 2));
          NODE

      - name: Validate corrected shard
        run: |
          node --check sentence_exam_eligibility_shard_b.js
          node scripts/audit-sentence-eligibility.mjs --allow-incomplete
          node scripts/test-sentence-eligibility-shards.mjs
          node scripts/audit-core-release.mjs --write-status
          node scripts/audit-core-release.mjs --full
          git diff --check

      - name: Restore permanent workflow and remove temporary machinery
        run: |
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm -f scripts/e1b-final-review.mjs .github/workflows/e1b-final-review.yml

      - name: Publish independently reviewed final tree
        run: |
          git config user.name "CameronNel"
          git config user.email "100732464+CameronNel@users.noreply.github.com"
          git add -A
          git commit -m "E1B: apply independent reviewer corrections"
          git push origin HEAD:core/e1b-review-s1051-s2100

  validate:
    needs: materialize-e1b-review
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Syntax-check every hand-edited runtime/data file the megabatch touches.
      # NOTE: `node --check` only checks its first filename argument, so each
      # file must be checked in its own invocation.
      - name: Check syntax
        run: |
          for f in app.js sw.js exam_integrity.js sentence_exam_eligibility.js words_lesson_plan.js; do
            echo "node --check $f"
            node --check "$f"
          done

      # Exam programme + integrity gate.
      - name: Audit exam integrity
        run: node scripts/audit-exam-integrity.mjs
      - name: Audit Hangul Mastery exam
        run: node scripts/audit-hangul-mastery-exam.mjs
      - name: Check word-exam competency map
        run: node scripts/build-word-exam-competency-map.mjs --check
      - name: Audit word exams
        run: node scripts/audit-word-exams.mjs

      # Learning-data gate (mirrors the Android workflow's learning-data step).
      - name: Audit words data
        run: node scripts/audit-words-data.mjs --strict
      - name: Thin-lesson heuristic regression
        run: node scripts/test-thin-lesson-heuristic.mjs
      - name: Audit sentences data
        run: node scripts/audit-sentences-data.mjs --strict
      - name: Audit form checks
        run: node scripts/audit-form-checks.mjs
      # NOTE: sentence-exam eligibility classification is still in progress
      # (see PR body). CI enforces the schema/tooling and progress via
      # --allow-incomplete; strict mode is the pre-merge gate and is added once
      # rows s0001–s4177 are fully reviewed.
      - name: Audit sentence eligibility (schema + progress)
        run: node scripts/audit-sentence-eligibility.mjs --allow-incomplete

      # Alphabet / recognition / handwriting / shell gate.
      - name: Audit alphabet audio coverage
        run: node scripts/audit-alphabet-audio.mjs --strict
      - name: Audit Hangul recognition
        run: node scripts/audit-hangul-recognition.mjs
      - name: Audit premium handwriting
        run: node scripts/audit-premium-handwriting.mjs
      - name: Audit app shell
        run: node scripts/audit-app-shell.mjs

  core-gate:
    needs: materialize-e1b-review
    name: Core-release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Single deterministic superset gate (docs/CORE_APP_COMPLETION_ROADMAP.md
      # packet C1). Runs the full required audit matrix, verifies the generated
      # status report is fresh, and exits non-zero on any child failure. The
      # mobile-package step SKIPs here (no prepared mobile/www); the Android
      # workflow performs that validation.
      - name: Run full core-release gate
        run: node scripts/audit-core-release.mjs --full
