name: CI

on:
  pull_request:
  push:
    branches: [main, exec/workstream-0-box-0b]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Box 0B patch
        if: github.actor != 'github-actions[bot]'
        run: python scripts/patch-workstream-0b.py

      - name: Run full Box 0B verification
        shell: bash
        run: |
          set -o pipefail
          {
            echo '$ node --check app.js sw.js exam_integrity.js scripts/audit-exam-integrity.mjs'
            node --check app.js
            node --check sw.js
            node --check exam_integrity.js
            node --check scripts/audit-exam-integrity.mjs
            echo
            echo '$ node scripts/audit-exam-integrity.mjs'
            node scripts/audit-exam-integrity.mjs
            echo
            echo '$ node scripts/audit-words-data.mjs --strict'
            node scripts/audit-words-data.mjs --strict
            echo
            echo '$ node scripts/audit-sentences-data.mjs --strict'
            node scripts/audit-sentences-data.mjs --strict
            echo
            echo '$ node scripts/audit-alphabet-audio.mjs --strict'
            node scripts/audit-alphabet-audio.mjs --strict
            echo
            echo '$ node scripts/audit-hangul-mastery-exam.mjs'
            node scripts/audit-hangul-mastery-exam.mjs
            echo
            echo '$ node scripts/audit-word-exams.mjs'
            node scripts/audit-word-exams.mjs
            echo
            echo '$ node scripts/audit-app-shell.mjs'
            node scripts/audit-app-shell.mjs
            echo
            echo '$ git diff --check'
            git diff --check
          } 2>&1 | tee WORKSTREAM_0_0B_AUDIT.txt

      - name: Static browser persistence smoke
        shell: bash
        run: |
          cat > .ws0b-smoke.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <script src="./exam_integrity.js?v=20260721b"></script>
          <script>
          const api = window.HANAPATH_EXAM_INTEGRITY;
          const state = {
            examResults: { version: 1, byAttemptId: {} },
            examIntegrity: { version: 1, taintEvents: [], resultRelations: [], migrationLog: [] },
            vocabLessonCompleted: []
          };
          const trace = [];
          const event = api.createTaintEvent({
            taintEventId: "taint-browser-smoke",
            controlId: "word-section-completion",
            affectedPillars: ["words"],
            scopeSectionIds: ["s1"],
            scopeUnitIds: ["s1-firstwords-u1"],
            scopeLessonIds: ["s1-firstwords-u1-l1"],
            activatedAt: 1784660000000,
            appVersion: "hanapath-shell-v437",
            appAssetRevision: "20260721b",
            queryGate: "__wetest",
            sourceRoute: { hub: "learn", item: "vocabulary", stage: null },
            note: "Owner testing override",
            clearedAt: null
          });
          const appended = api.appendTaintEvent(state, event);
          if (appended.added) {
            localStorage.setItem("hanapath-v1", JSON.stringify(state));
            const persisted = JSON.parse(localStorage.getItem("hanapath-v1") || "{}");
            const durable = persisted.examIntegrity.taintEvents.some((item) => item.taintEventId === event.taintEventId);
            if (durable) {
              trace.push("taint-saved");
              state.vocabLessonCompleted.push("s1-firstwords-u1-l1");
              trace.push("progress-mutated");
            }
          }
          const context = api.getAttemptTaintContext(state, ["s1"], []);
          document.documentElement.dataset.pass = String(
            trace.join(",") === "taint-saved,progress-mutated"
            && context.isPractice
            && context.overrideEventIds[0] === "taint-browser-smoke"
          );
          </script>
          HTML
          python -m http.server 8000 >/tmp/ws0b-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/.ws0b-smoke.html >/dev/null && break; sleep 0.25; done
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo 'No headless browser available on runner' >&2
            exit 1
          fi
          "$browser" --headless --no-sandbox --disable-gpu --dump-dom 'http://127.0.0.1:8000/.ws0b-smoke.html?__wetest=1' | tee WORKSTREAM_0_0B_BROWSER.txt
          grep -q 'data-pass="true"' WORKSTREAM_0_0B_BROWSER.txt
          echo 'BROWSER SMOKE: PASS — taint appended, durably stored, re-read before mutation, and intersecting scope classified Practice' | tee -a WORKSTREAM_0_0B_AUDIT.txt
          rm .ws0b-smoke.html WORKSTREAM_0_0B_BROWSER.txt

      - name: Publish verified implementation atomically
        if: github.actor != 'github-actions[bot]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_NAME: exec/workstream-0-box-0b
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["BRANCH_NAME"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "app.js",
              "exam_integrity.js",
              "index.html",
              "sw.js",
              "scripts/audit-exam-integrity.mjs",
          ]

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "hanapath-workstream-0b",
                  },
              )
              with urlopen(req) as response:
                  return json.load(response)

          base_commit = api("GET", f"git/ref/heads/{branch}")["object"]["sha"]
          base_tree = api("GET", f"git/commits/{base_commit}")["tree"]["sha"]
          entries = []
          for filename in files:
              encoded = base64.b64encode(Path(filename).read_bytes()).decode("ascii")
              blob = api("POST", "git/blobs", {"content": encoded, "encoding": "base64"})["sha"]
              entries.append({"path": filename, "mode": "100644", "type": "blob", "sha": blob})
          tree = api("POST", "git/trees", {"base_tree": base_tree, "tree": entries})["sha"]
          commit = api("POST", "git/commits", {
              "message": "Gate section completion behind durable taint",
              "tree": tree,
              "parents": [base_commit],
          })["sha"]
          api("PATCH", f"git/refs/heads/{branch}", {"sha": commit, "force": False})
          print(f"Published {commit}")
          PY

      - name: Post full audit output
        if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Automated Box 0B verification'
            echo
            echo '```text'
            cat WORKSTREAM_0_0B_AUDIT.txt
            echo '```'
          } > /tmp/pr-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/pr-comment.md
