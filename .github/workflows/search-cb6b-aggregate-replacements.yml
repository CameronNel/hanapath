name: search-cb6b-aggregate-replacements

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search aggregate rare-tag coverage
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const inventory = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_inventory.json', 'utf8')).inventory;
          const authoring = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_authoring.json', 'utf8'));
          const sandbox = { window: {} };
          sandbox.self = sandbox.window;
          sandbox.globalThis = sandbox.window;
          vm.createContext(sandbox);
          for (const file of ['sentence_exam_curated_bank.js','sentence_exam_curated_bank_freeze.js']) vm.runInContext(fs.readFileSync(file,'utf8'), sandbox, { filename:file });
          const excluded = new Set([...sandbox.window.HANAPATH_SENTENCE_EXAM_CURATED_BANK.entries.map(e=>e.id), ...authoring.entries.map(e=>e.id)]);
          const specs = {
            stage1FormalWant: { maxSection:2, groups:[['formal-nida','want-go-sipda']] },
            stage1But: { maxSection:2, groups:[['but-jiman']] },
            stage1Want: { maxSection:2, groups:[['want-go-sipda']] },
            stage1CopulaNegative: { maxSection:2, groups:[['copula-negative-anieyo']] },
            stage2Future: { maxSection:4, groups:[['future-geoyeyo']] },
            stage3Can: { maxSection:6, groups:[['can-su-itda']] },
            stage3WhenFuture: { maxSection:6, groups:[['when-ttae','future-geoyeyo'],['when-ttae']] },
            stage4FormalHonorific: { maxSection:8, groups:[['formal-nida','honorific-si']] },
          };
          const report = {};
          for (const [name,spec] of Object.entries(specs)) {
            report[name] = inventory.filter(row => !excluded.has(row.id)
              && Number(row.candidateAssessment?.primarySection || row.sectionOrders?.[0]) <= spec.maxSection
              && spec.groups.some(group => group.every(tag => (row.patternTags||[]).includes(tag))))
              .map(row => ({
                id:row.id,
                section:Number(row.candidateAssessment?.primarySection || row.sectionOrders?.[0]),
                korean:row.korean,
                english:row.english,
                tags:row.patternTags,
                flags:row.ambiguityFlags,
                lessons:row.lessonIds,
              }))
              .sort((a,b) => a.section-b.section || a.flags.length-b.flags.length || a.id.localeCompare(b.id))
              .slice(0,50);
          }
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_aggregate_replacement_search.json', `${JSON.stringify({schemaVersion:1,report},null,2)}\n`);
          NODE
      - name: Commit report and remove workflow
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/search-cb6b-aggregate-replacements.yml
          git add docs/generated/sentence_exam_cb6b_aggregate_replacement_search.json
          git diff --cached --check
          git commit -m "CB6B: search aggregate rare-tag coverage"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
