name: CB2 Secondary Cue Sync

# Temporary focused workflow; removed after the app/audit commit lands.
on:
  pull_request:
    paths:
      - ".github/workflows/cb2-secondary-cue-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Preserve controlled cues across spaced retrieval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Patch secondary lesson retrieval
        shell: python
        run: |
          from pathlib import Path

          app = Path("app.js")
          text = app.read_text(encoding="utf-8")
          old = "\n".join([
              "  const secondary = studyRows.map((row, index) => ({",
              "    sentenceId: row.id,",
              "    mode: secondMode(row, primary[index].mode),",
              "  }));",
          ])
          new = "\n".join([
              "  const secondary = studyRows.map((row, index) => ({",
              "    sentenceId: row.id,",
              "    mode: secondMode(row, primary[index].mode),",
              "    promptEn: primary[index].promptEn,",
              "    cueLabel: primary[index].promptEn ? \"Controlled target review\" : primary[index].cueLabel,",
              "    teachingPhase: primary[index].teachingPhase,",
              "  }));",
          ])
          if new not in text:
              if old not in text:
                  raise SystemExit("Expected secondary lesson-plan block not found")
              app.write_text(text.replace(old, new, 1), encoding="utf-8")

          audit = Path("scripts/audit-sentence-lesson-contrasts.mjs")
          text = audit.read_text(encoding="utf-8")
          old = "\n".join([
              '  "configuredEntry.promptEn",',
              "]) {",
          ])
          new = "\n".join([
              '  "configuredEntry.promptEn",',
              '  "promptEn: primary[index].promptEn",',
              '  "Controlled target review",',
              "]) {",
          ])
          if new not in text:
              if old not in text:
                  raise SystemExit("Expected app integration marker list not found")
              audit.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate focused CB2 contracts
        run: |
          node --check app.js
          node --check scripts/audit-sentence-lesson-contrasts.mjs
          node scripts/build-sentence-lesson-contrasts.mjs --check
          node scripts/audit-sentence-lesson-contrasts.mjs
          node scripts/test-sentence-lesson-contrasts-browser.mjs
          node scripts/audit-exam-integrity.mjs
      - name: Commit controlled-cue fix
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/audit-sentence-lesson-contrasts.mjs
          if git diff --cached --quiet; then
            echo "Secondary controlled cue already current."
            exit 0
          fi
          git commit -m "CB2: preserve controlled cue across spaced retrieval"
          git push origin "HEAD:${HEAD_BRANCH}"
