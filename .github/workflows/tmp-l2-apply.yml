name: Diagnose L2 syntax

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'core/l2-sentence-positional-near-miss-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout L2 branch
        uses: actions/checkout@v4
        with:
          ref: core/l2-sentence-positional-near-miss-feedback
          fetch-depth: 1
          show-progress: false

      - name: Apply L2 patch and capture parser output
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/l2.patch.gz.b64 | gzip --decompress > /tmp/l2.patch
          git apply --check /tmp/l2.patch
          git apply /tmp/l2.patch
          {
            node --version
            node --check sentence_feedback.js
          } > /tmp/l2-syntax-diagnostic.txt 2>&1 || true
          git reset -- .
          git checkout -- .
          git clean -fd
          cp /tmp/l2-syntax-diagnostic.txt .github/l2-syntax-diagnostic.txt
          git config user.name 'HanaPath Coder'
          git config user.email 'noreply@openai.com'
          git add .github/l2-syntax-diagnostic.txt
          git commit -m 'chore: capture L2 syntax diagnostic'
          git push origin HEAD:core/l2-sentence-positional-near-miss-feedback
