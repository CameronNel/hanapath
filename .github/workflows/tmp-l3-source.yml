name: Temporary L3 source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'core/l3-authored-item-audio-closure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh L3 branch
        uses: actions/checkout@v4
        with:
          ref: core/l3-authored-item-audio-closure
          show-progress: false

      - name: Package repository source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=hanapath-source.tgz -czf /tmp/hanapath-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hanapath-l3-current-main
          path: /tmp/hanapath-source.tgz
          retention-days: 1
          if-no-files-found: error
