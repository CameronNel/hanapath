name: E1A one-shot assembler

on:
  push:
    branches:
      - core/e1a-review-s0001-s1050
    paths:
      - .github/workflows/e1a-assemble.yml

permissions:
  contents: write

jobs:
  assemble-validate-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout E1A branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct reviewed shard
        shell: bash
        run: |
          set -euo pipefail
          cat .e1a-payload/chunk_*.b64 \
            | tr -d '\n\r' \
            | base64 --decode \
            | gzip --decompress \
            > sentence_exam_eligibility_shard_a.js
          test "$(wc -c < sentence_exam_eligibility_shard_a.js)" -eq 824173

      - name: Validate E1A output
        shell: bash
        run: |
          set -euo pipefail
          node --check sentence_exam_eligibility_shard_a.js
          node scripts/audit-sentence-eligibility.mjs --allow-incomplete
          node scripts/audit-core-release.mjs --quick
          git diff --check

      - name: Commit final one-file packet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .e1a-payload
          rm -f .github/workflows/e1a-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E1A: review sentence eligibility rows s0001-s1050"
          git push origin HEAD:core/e1a-review-s0001-s1050
