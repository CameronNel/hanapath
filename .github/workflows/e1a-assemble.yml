name: E1A one-shot assembler

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - .e1a-payload/**
      - .github/workflows/e1a-assemble.yml

permissions:
  contents: write

jobs:
  assemble-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'core/e1a-review-s0001-s1050'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout E1A branch
        uses: actions/checkout@v4
        with:
          ref: core/e1a-review-s0001-s1050
          fetch-depth: 0

      - name: Reconstruct reviewed shard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          chunk_paths = sorted(Path('.e1a-payload').glob('chunk_*.b64'))
          if len(chunk_paths) != 10:
              raise SystemExit(f'expected 10 payload chunks, found {len(chunk_paths)}')
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in chunk_paths)
          if len(encoded) != 96188:
              raise SystemExit(f'expected 96188 base64 characters, found {len(encoded)}')
          compressed = base64.b64decode(encoded, validate=True)
          output = gzip.decompress(compressed)
          if len(output) != 824173:
              raise SystemExit(f'expected 824173 reconstructed bytes, found {len(output)}')
          Path('sentence_exam_eligibility_shard_a.js').write_bytes(output)
          print(f'reconstructed {len(output)} bytes from {len(chunk_paths)} chunks')
          PY

      - name: Validate E1A output
        shell: bash
        run: |
          set -euo pipefail
          node --check sentence_exam_eligibility_shard_a.js
          node scripts/audit-sentence-eligibility.mjs --allow-incomplete
          node scripts/audit-core-release.mjs --quick
          git diff --check

      - name: Commit final one-file packet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .e1a-payload
          rm -f .github/workflows/e1a-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E1A: review sentence eligibility rows s0001-s1050"
          git push origin HEAD:core/e1a-review-s0001-s1050
