name: E1A one-shot assembler

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - .e1a-payload/**
      - .github/workflows/e1a-assemble.yml

permissions:
  contents: write

jobs:
  assemble-validate-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'core/e1a-review-s0001-s1050'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout E1A branch
        uses: actions/checkout@v4
        with:
          ref: core/e1a-review-s0001-s1050
          fetch-depth: 0

      - name: Reconstruct reviewed shard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          chunk_paths = sorted(Path('.e1a-payload').glob('chunk_*.b64'))
          encoded = ''.join(path.read_text(encoding='ascii').strip() for path in chunk_paths)
          output = gzip.decompress(base64.b64decode(encoded, validate=True))
          if len(chunk_paths) != 10 or len(encoded) != 96188 or len(output) != 824173:
              raise SystemExit(f'payload mismatch: chunks={len(chunk_paths)}, encoded={len(encoded)}, output={len(output)}')
          Path('sentence_exam_eligibility_shard_a.js').write_bytes(output)
          print(f'reconstructed {len(output)} bytes from {len(chunk_paths)} chunks')
          PY

      - name: Validate E1A output
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          : > e1a-validation.txt
          status=0
          run_check() {
            name="$1"
            shift
            echo "===== ${name} =====" | tee -a e1a-validation.txt
            "$@" 2>&1 | tee -a e1a-validation.txt
            rc=${PIPESTATUS[0]}
            echo "exit=${rc}" | tee -a e1a-validation.txt
            if [ "$rc" -ne 0 ]; then status="$rc"; fi
          }
          run_check syntax node --check sentence_exam_eligibility_shard_a.js
          run_check eligibility node scripts/audit-sentence-eligibility.mjs --allow-incomplete
          run_check core-quick node scripts/audit-core-release.mjs --quick
          run_check diff-check git diff --check
          exit "$status"

      - name: Upload validation transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1a-validation-transcript
          path: e1a-validation.txt
          if-no-files-found: error

      - name: Stop after validation failure
        if: steps.validate.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Commit final one-file packet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .e1a-payload
          rm -f .github/workflows/e1a-assemble.yml e1a-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E1A: review sentence eligibility rows s0001-s1050"
          git push origin HEAD:core/e1a-review-s0001-s1050
