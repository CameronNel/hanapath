name: analyse-cb6b-copula-negative-swap

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map copula-negative candidates to typed occupants
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const inventoryDoc = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_inventory.json','utf8'));
          const inventory = inventoryDoc.inventory;
          const byId = new Map(inventory.map((row)=>[row.id,row]));
          const authoring = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_authoring.json','utf8'));
          const witness = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_witness.json','utf8'));
          const sandbox = {window:{}};
          sandbox.self=sandbox.window; sandbox.globalThis=sandbox.window; vm.createContext(sandbox);
          for(const file of ['sentence_exam_curated_bank.js','sentence_exam_curated_bank_freeze.js']) vm.runInContext(fs.readFileSync(file,'utf8'),sandbox,{filename:file});
          const bank=sandbox.window.HANAPATH_SENTENCE_EXAM_CURATED_BANK;
          const typed=[...bank.entries.filter(e=>e.mode==='typed').map(e=>({origin:'bank',...e})),...authoring.entries.filter(e=>e.mode==='typed').map(e=>({origin:'cb6b',...e}))];
          const occupants=new Map();
          for(const entry of typed){
            for(const lesson of byId.get(entry.id)?.lessonIds||[]){
              if(!occupants.has(lesson)) occupants.set(lesson,[]);
              occupants.get(lesson).push({id:entry.id,origin:entry.origin,tags:byId.get(entry.id)?.patternTags||[],section:Number(byId.get(entry.id)?.candidateAssessment?.primarySection||byId.get(entry.id)?.sectionOrders?.[0])});
            }
          }
          const uses=new Map();
          for(const [examId,attempts] of Object.entries(witness.exams||{})) attempts.forEach((attempt,i)=>attempt.forEach(sel=>{
            if(!uses.has(sel.id)) uses.set(sel.id,[]);
            uses.get(sel.id).push({examId,attempt:i+1,strand:sel.strand});
          }));
          const candidates=inventory.filter(row=>(row.patternTags||[]).includes('copula-negative-anieyo')).map(row=>({
            id:row.id,
            korean:row.korean,
            english:row.english,
            section:Number(row.candidateAssessment?.primarySection||row.sectionOrders?.[0]),
            tags:row.patternTags,
            flags:row.ambiguityFlags,
            lessons:row.lessonIds,
            occupants:[...new Set((row.lessonIds||[]).flatMap(lesson=>(occupants.get(lesson)||[]).map(item=>JSON.stringify({...item,lesson}))))].map(JSON.parse),
            candidateUses:uses.get(row.id)||[],
          }));
          for(const candidate of candidates) for(const occupant of candidate.occupants) occupant.uses=uses.get(occupant.id)||[];
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_copula_swap_analysis.json',`${JSON.stringify({schemaVersion:1,candidates},null,2)}\n`);
          NODE
      - name: Commit analysis and remove workflow
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/analyse-cb6b-copula-swap.yml
          git add docs/generated/sentence_exam_cb6b_copula_swap_analysis.json
          git diff --cached --check
          git commit -m "CB6B: analyse copula-negative capacity swap"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
