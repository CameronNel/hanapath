name: CB4 Finalize Authoring

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    name: Finalize CB4 authoring gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install permanent CB4 core gate
        run: node scripts/cb4-finalize-authoring.mjs

      - name: Validate final authoring head
        run: |
          node --check scripts/build-sentence-exam-curated-bank.mjs
          node --check scripts/audit-sentence-exam-curated-bank-cb4.mjs
          node --check scripts/test-sentence-exam-curated-bank-cb4.mjs
          node scripts/build-sentence-exam-curated-bank.mjs --check
          node scripts/audit-sentence-exam-curated-bank-cb4.mjs
          node scripts/test-sentence-exam-curated-bank-cb4.mjs
          node scripts/audit-sentence-exam-curated-bank.mjs
          node scripts/audit-core-release.mjs --write-status
          git diff --check

      - name: Commit permanent gate and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-core-release.mjs docs/CORE_APP_STATUS.md
          if git diff --cached --quiet; then
            echo "Permanent gate already current."
          else
            git commit -m "CB4: wire curated bank authoring into core gate"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
