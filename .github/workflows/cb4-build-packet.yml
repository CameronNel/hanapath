name: CB4 Build Packet

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build CB4 authoring package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve ambiguity flags for review
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/build-sentence-exam-curated-bank.mjs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '  if (analysis.flags.length > 0) return { rejected: `ambiguity:${analysis.flags.join(",")}` };\n',
              '',
          )
          marker = '      promptOrigin: contrast.promptReviewRequired ? "cb2-cb3-generated" : "reviewed-source-reuse",\n'
          replacement = marker + '      authoringAmbiguityFlags: [...analysis.flags].sort(),\n'
          if replacement not in text:
              if marker not in text:
                  raise SystemExit("Missing promptOrigin marker")
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")

      - name: Generate and validate CB4 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          (
            set -e
            node --check scripts/build-sentence-exam-curated-bank.mjs
            node --check scripts/audit-sentence-exam-curated-bank-cb4.mjs
            node --check scripts/test-sentence-exam-curated-bank-cb4.mjs
            node scripts/build-sentence-exam-curated-bank.mjs --write
            node scripts/build-sentence-exam-curated-bank.mjs --check
            node scripts/audit-sentence-exam-curated-bank-cb4.mjs
            node scripts/test-sentence-exam-curated-bank-cb4.mjs
            node scripts/audit-sentence-exam-curated-bank.mjs
            node scripts/audit-core-release.mjs --write-status
            git diff --check
          ) > .cb4-build.log 2>&1
          status=$?
          cat .cb4-build.log
          if [ "$status" -ne 0 ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file .cb4-build.log
            exit "$status"
          fi

      - name: Upload generated package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb4-authoring-package
          path: |
            .cb4-build.log
            docs/generated/sentence_exam_curated_bank_cb4_authoring.json
            docs/reviews/sentence_exam_curated_bank_cb4_reviews.json
            docs/CORE_APP_STATUS.md
          if-no-files-found: warn

      - name: Commit generated authoring evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          (
            set -e
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/build-sentence-exam-curated-bank.mjs \
              docs/generated/sentence_exam_curated_bank_cb4_authoring.json \
              docs/reviews/sentence_exam_curated_bank_cb4_reviews.json \
              docs/CORE_APP_STATUS.md
            git status --short
            git commit -m "CB4: generate curated bank authoring package"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          ) > .cb4-push.log 2>&1
          status=$?
          cat .cb4-push.log
          if [ "$status" -ne 0 ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file .cb4-push.log
            exit "$status"
          fi
