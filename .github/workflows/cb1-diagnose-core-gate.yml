name: CB1 Refresh Core Status

on:
  pull_request:
    paths:
      - ".github/workflows/cb1-diagnose-core-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh generated core status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate status
        run: node scripts/audit-core-release.mjs --write-status
      - name: Commit generated status
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CORE_APP_STATUS.md
          if git diff --cached --quiet; then
            echo "Status already current."
            exit 0
          fi
          git commit -m "CB1: refresh generated core status"
          git push origin "HEAD:${HEAD_BRANCH}"
