name: apply-cb6a-tag-parity

on:
  push:
    branches:
      - core/cb6a-controlled-clause-contract

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact tag parity hardening
        run: |
          base64 --decode .github/cb6a-tag-parity.patch.gz.b64 | gzip --decompress > /tmp/cb6a-tag-parity.patch
          git apply --check /tmp/cb6a-tag-parity.patch
          git apply /tmp/cb6a-tag-parity.patch
      - name: Validate contract and frozen bank
        run: |
          node --check scripts/lib/sentence-exam-ambiguity.mjs
          node --check scripts/audit-sentence-exam-curated-bank.mjs
          node --check scripts/test-sentence-exam-ambiguity.mjs
          node --check sentence_exam_prompt_templates.js
          node scripts/test-sentence-exam-ambiguity.mjs
          node scripts/audit-sentence-exam-curated-bank.mjs
          node scripts/test-sentence-exam-grader.mjs
          node scripts/test-sentence-exam-curated-bank-cb4.mjs
          node scripts/test-sentence-exam-curated-bank-freeze.mjs
          node scripts/build-sentence-exam-curated-bank.mjs --check
          node scripts/build-sentence-exam-curated-bank-freeze.mjs --check
      - name: Commit permanent changes
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/cb6a-tag-parity.patch.gz.b64 .github/workflows/apply-cb6a-tag-parity.yml
          git add scripts
          git diff --cached --check
          git commit -m "CB6A: require exact live-row tag parity"
          git push origin HEAD:core/cb6a-controlled-clause-contract
