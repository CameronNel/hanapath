name: E1B independent reviewer correction

on:
  push:
    branches:
      - core/e1b-review-s1051-s2100
    paths:
      - scripts/e1b-final-review.mjs
      - .github/workflows/e1b-final-review.yml

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout packet branch
        uses: actions/checkout@v4
        with:
          ref: core/e1b-review-s1051-s2100
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate independently reviewed shard
        run: node scripts/e1b-final-review.mjs

      - name: Syntax check shard
        run: node --check sentence_exam_eligibility_shard_b.js

      - name: Audit sentence eligibility
        run: node scripts/audit-sentence-eligibility.mjs --allow-incomplete

      - name: Test shard integrity fixtures
        run: node scripts/test-sentence-eligibility-shards.mjs

      - name: Regenerate status
        run: node scripts/audit-core-release.mjs --write-status

      - name: Run full core gate
        run: node scripts/audit-core-release.mjs --full

      - name: Check whitespace
        run: git diff --check

      - name: Remove temporary reviewer machinery
        run: rm -f scripts/e1b-final-review.mjs .github/workflows/e1b-final-review.yml

      - name: Commit reviewed final tree
        run: |
          git config user.name "CameronNel"
          git config user.email "100732464+CameronNel@users.noreply.github.com"
          git add sentence_exam_eligibility_shard_b.js docs/CORE_APP_STATUS.md scripts/e1b-final-review.mjs .github/workflows/e1b-final-review.yml
          git commit -m "E1B: apply independent reviewer corrections"
          git push origin HEAD:core/e1b-review-s1051-s2100

# Triggered after workflow registration so GitHub executes the correction job.
