name: Build rhinoplasty photo gallery

on:
  workflow_dispatch:
  push:
    branches:
      - rhinoplasty-photo-gallery
    paths:
      - 'rhinoplasty_gallery/build_gallery.py'
      - '.github/workflows/build-rhinoplasty-gallery.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rhinoplasty-photo-gallery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pillow
      - name: Build self-contained gallery
        run: python rhinoplasty_gallery/build_gallery.py
      - name: Commit generated gallery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rhinoplasty_gallery/index.html rhinoplasty_gallery/report.json
          git diff --cached --quiet || git commit -m 'Build embedded rhinoplasty gallery [skip ci]'
          git push origin HEAD:rhinoplasty-photo-gallery
