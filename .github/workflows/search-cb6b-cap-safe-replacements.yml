name: search-cb6b-cap-safe-replacements

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find non-conflicting rare-tag candidates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const inventory = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_inventory.json', 'utf8')).inventory;
          const authoring = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_authoring.json', 'utf8'));
          const mappings = JSON.parse(fs.readFileSync('docs/authoring/sentence_exam_cb6b_replacements.json', 'utf8')).mappings;
          const replacementIds = new Set(mappings.map((item) => item.replacementId));
          const sandbox = { window: {} };
          sandbox.self = sandbox.window;
          sandbox.globalThis = sandbox.window;
          vm.createContext(sandbox);
          for (const file of ['sentence_exam_curated_bank.js','sentence_exam_curated_bank_freeze.js']) vm.runInContext(fs.readFileSync(file,'utf8'), sandbox, { filename:file });
          const bank = sandbox.window.HANAPATH_SENTENCE_EXAM_CURATED_BANK;
          const excludedIds = new Set([...bank.entries.map((entry) => entry.id), ...authoring.entries.filter((entry) => !replacementIds.has(entry.id)).map((entry) => entry.id)]);
          const usedTypedLessons = new Set();
          for (const entry of bank.entries.filter((entry) => entry.mode === 'typed')) for (const lesson of entry.sourceLessonIds || []) usedTypedLessons.add(lesson);
          for (const entry of authoring.entries.filter((entry) => entry.mode === 'typed' && !replacementIds.has(entry.id))) for (const lesson of entry.sourceLessonIds || []) usedTypedLessons.add(lesson);
          const specs = {
            formal: { maxSection:2, groups:[['formal-nida']] },
            copulaNegative: { maxSection:2, groups:[['copula-negative-anieyo']] },
            future: { maxSection:4, groups:[['future-geoyeyo']] },
            canFormalNeg: { maxSection:6, groups:[['can-su-itda','formal-nida'],['can-su-itda','neg-mot'],['can-su-itda']] },
            formalHonorific: { maxSection:8, groups:[['formal-nida','honorific-si'],['formal-nida']] },
            but: { maxSection:2, groups:[['but-jiman']] },
            want: { maxSection:2, groups:[['want-go-sipda']] },
            when: { maxSection:6, groups:[['when-ttae','future-geoyeyo'],['when-ttae']] },
          };
          const report = {};
          for (const [name,spec] of Object.entries(specs)) {
            report[name] = inventory.filter((row) => !excludedIds.has(row.id)
              && Number(row.candidateAssessment?.primarySection || row.sectionOrders?.[0]) <= spec.maxSection
              && !(row.lessonIds || []).some((lesson) => usedTypedLessons.has(lesson))
              && spec.groups.some((group) => group.every((tag) => (row.patternTags || []).includes(tag))))
              .map((row) => ({
                id: row.id,
                section: Number(row.candidateAssessment?.primarySection || row.sectionOrders?.[0]),
                korean: row.korean,
                english: row.english,
                tags: row.patternTags,
                flags: row.ambiguityFlags,
                lessons: row.lessonIds,
              }))
              .sort((a,b) => a.section-b.section || a.flags.length-b.flags.length || a.id.localeCompare(b.id))
              .slice(0,40);
          }
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_cap_safe_replacement_search.json', `${JSON.stringify({schemaVersion:1,report},null,2)}\n`);
          NODE
      - name: Commit report and remove workflow
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/search-cb6b-cap-safe-replacements.yml
          git add docs/generated/sentence_exam_cb6b_cap_safe_replacement_search.json
          git diff --cached --check
          git commit -m "CB6B: search lesson-cap-safe replacements"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
