name: Finalize L3 permanent audio gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'core/l3-authored-item-audio-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout L3 branch
        uses: actions/checkout@v4
        with:
          ref: core/l3-authored-item-audio-closure
          fetch-depth: 0
          show-progress: false

      - name: Add permanent L3 runtime and gate wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ('./audio_map.js?v=20260717u', './audio_map.js?v=20260727b'),
              ],
              'sw.js': [
                  ('./audio_map.js?v=20260717u', './audio_map.js?v=20260727b'),
              ],
              '.github/workflows/ci.yml': [
                  (
                      '      - name: Sentence lesson contrast browser fixtures sections 5-8\n'
                      '        run: node scripts/test-sentence-lesson-contrasts-browser-sections-5-8.mjs\n\n'
                      '      # Alphabet / recognition / handwriting / shell gate.\n',
                      '      - name: Sentence lesson contrast browser fixtures sections 5-8\n'
                      '        run: node scripts/test-sentence-lesson-contrasts-browser-sections-5-8.mjs\n\n'
                      '      # Authored-item audio closure (L3).\n'
                      '      - name: Audit authored audio coverage\n'
                      '        run: node scripts/audit-audio-coverage.mjs --strict\n'
                      '      - name: Authored audio discovery regression\n'
                      '        run: node scripts/test-authored-audio-targets.mjs\n'
                      '      - name: Authored audio runtime regression\n'
                      '        run: node scripts/test-authored-audio-runtime.mjs\n\n'
                      '      # Alphabet / recognition / handwriting / shell gate.\n'
                  ),
              ],
              'scripts/audit-core-release.mjs': [
                  (
                      '  { id: "audio-coverage", label: "Audio coverage", script: "scripts/audit-audio-coverage.mjs" },\n'
                      '  { id: "alphabet-audio", label: "Alphabet audio coverage", script: "scripts/audit-alphabet-audio.mjs", fullArgs: ["--strict"], quickArgs: ["--strict"] },\n',
                      '  { id: "audio-coverage", label: "Audio coverage", script: "scripts/audit-audio-coverage.mjs" },\n'
                      '  { id: "authored-audio-targets", label: "Authored audio target discovery regression (L3)", script: "scripts/test-authored-audio-targets.mjs" },\n'
                      '  { id: "authored-audio-runtime", label: "Authored audio mapped-runtime regression (L3)", script: "scripts/test-authored-audio-runtime.mjs" },\n'
                      '  { id: "alphabet-audio", label: "Alphabet audio coverage", script: "scripts/audit-alphabet-audio.mjs", fullArgs: ["--strict"], quickArgs: ["--strict"] },\n'
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f'{name}: expected L3 insertion point not found')
              path.write_text(text)
          PY

          base64 --decode > scripts/test-authored-audio-runtime.mjs <<'B64'
          
          B64
          chmod +x scripts/test-authored-audio-runtime.mjs

      - name: Validate permanent L3 contracts and refresh status
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lib/authored-audio-targets.mjs
          node --check scripts/test-authored-audio-targets.mjs
          node --check scripts/test-authored-audio-runtime.mjs
          node --check scripts/audit-audio-coverage.mjs
          node --check scripts/audit-core-release.mjs
          node scripts/test-authored-audio-targets.mjs
          node scripts/test-authored-audio-runtime.mjs
          node scripts/audit-audio-coverage.mjs --strict
          node scripts/audit-app-shell.mjs
          node scripts/audit-core-release.mjs --write-status
          git diff --check

      - name: Commit permanent L3 gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HanaPath Coder'
          git config user.email 'noreply@openai.com'
          git add .github/workflows/ci.yml index.html sw.js \
            scripts/audit-core-release.mjs scripts/test-authored-audio-runtime.mjs \
            docs/CORE_APP_STATUS.md
          git commit -m 'L3: make authored audio closure a permanent gate'
          git push origin HEAD:core/l3-authored-item-audio-closure
