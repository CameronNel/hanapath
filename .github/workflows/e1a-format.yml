name: E1A reviewable formatting

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/e1a-format.yml

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'core/e1a-review-s0001-s1050'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout E1A branch
        uses: actions/checkout@v4
        with:
          ref: core/e1a-review-s0001-s1050
          fetch-depth: 0

      - name: Expand shard into reviewable formatting
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const file = 'sentence_exam_eligibility_shard_a.js';
          const window = {};
          const sandbox = { window, self: window, globalThis: window };
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync(file, 'utf8'), sandbox, { filename: file });
          const shard = window.HANAPATH_SENTENCE_EXAM_ELIGIBILITY_SHARDS?.A;
          if (!shard || Object.keys(shard.reviewedRows || {}).length !== 1050) {
            throw new Error('Expected the complete 1,050-row E1A shard before formatting.');
          }
          const serialized = JSON.stringify(shard, null, 2).replace(/\n/g, '\n  ');
          const output = [
            '// HanaPath Sentence Examination Eligibility — Shard A (s0001–s1050).',
            '// Plain static browser global — no build step.',
            '//',
            '// Packet E1A reviewed every row in this fixed shard. Edit only rows',
            '// s0001–s1050 here; shared loader and audit logic live outside this file.',
            '(function () {',
            '  "use strict";',
            '  var registry = (window.HANAPATH_SENTENCE_EXAM_ELIGIBILITY_SHARDS =',
            '    window.HANAPATH_SENTENCE_EXAM_ELIGIBILITY_SHARDS || {});',
            `  registry.A = ${serialized};`,
            '})();',
            '',
          ].join('\n');
          fs.writeFileSync(file, output);
          console.log(`formatted ${Object.keys(shard.reviewedRows).length} reviewed rows into ${output.split('\n').length} lines`);
          NODE

      - name: Verify semantic identity and audits
        shell: bash
        run: |
          set -euo pipefail
          node --check sentence_exam_eligibility_shard_a.js
          node scripts/audit-sentence-eligibility.mjs --allow-incomplete
          node scripts/audit-core-release.mjs --check-status
          git diff --check

      - name: Commit reviewable shard
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/e1a-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E1A: format reviewed shard for human review"
          git push origin HEAD:core/e1a-review-s0001-s1050
