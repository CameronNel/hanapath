name: search-cb6b-targeted-replacements

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search live inventory for rare-tag replacements
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const inventory = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_inventory.json', 'utf8')).inventory;
          const authoring = JSON.parse(fs.readFileSync('docs/generated/sentence_exam_cb6_capacity_authoring.json', 'utf8'));
          const sandbox = { window: {} };
          sandbox.self = sandbox.window;
          sandbox.globalThis = sandbox.window;
          vm.createContext(sandbox);
          for (const file of ['sentence_exam_curated_bank.js','sentence_exam_curated_bank_freeze.js']) vm.runInContext(fs.readFileSync(file,'utf8'), sandbox, { filename:file });
          const excluded = new Set([...sandbox.window.HANAPATH_SENTENCE_EXAM_CURATED_BANK.entries.map(e=>e.id), ...authoring.entries.map(e=>e.id)]);
          const specs = {
            s1437: { section:2, any:[['formal-nida','direction-euro'],['formal-nida','topic-neun']] },
            s2247: { section:2, any:[['copula-negative-anieyo']] },
            s2542: { section:4, any:[['future-geoyeyo','location-e'],['future-geoyeyo','topic-neun']] },
            s3345: { section:5, any:[['can-su-itda','formal-nida'],['can-su-itda','neg-mot']] },
            s3327: { section:7, any:[['formal-nida','honorific-si'],['formal-nida','imperative-seyo']] },
            s3443: { section:2, any:[['but-jiman','want-go-sipda'],['but-jiman']] },
            s3508: { section:2, any:[['want-go-sipda','only-man'],['want-go-sipda']] },
            s2605: { section:5, any:[['when-ttae','future-geoyeyo'],['when-ttae']] },
          };
          const report = {};
          for (const [id,spec] of Object.entries(specs)) {
            const candidates = inventory.filter(row => !excluded.has(row.id)
              && Number(row.candidateAssessment?.primarySection || row.sectionOrders?.[0]) === spec.section
              && spec.any.some(group => group.every(tag => (row.patternTags||[]).includes(tag))))
              .map(row => ({ id:row.id, korean:row.korean, english:row.english, tags:row.patternTags, flags:row.ambiguityFlags, lessons:row.lessonIds }))
              .sort((a,b) => a.flags.length-b.flags.length || a.id.localeCompare(b.id))
              .slice(0,20);
            report[id] = candidates;
          }
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_targeted_replacement_search.json', `${JSON.stringify({schemaVersion:1,report},null,2)}\n`);
          NODE
      - name: Commit report and remove workflow
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/search-cb6b-targeted-replacements.yml
          git add docs/generated/sentence_exam_cb6b_targeted_replacement_search.json
          git diff --cached --check
          git commit -m "CB6B: search rare-tag replacements"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
