name: Android build

on:
  pull_request:
    paths:
      - "mobile/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "sw.js"
      - "audio_map.js"
      - "words_*.js"
      - "sentences_*.js"
      - "raw_word_meanings.js"
      - "hangul_strokes.js"
      - "alphabet_skill_srs.js"
      - "manifest.webmanifest"
      - "fonts/**"
      - "lib/**"
      - "icons/**"
      - "scripts/audit-mobile-package.mjs"
      - "scripts/test-mobile-safe-area-browser.mjs"
      - "scripts/test-android-release-safety.mjs"
      - "scripts/test-native-lesson-ads.mjs"
      - "scripts/audit-premium-handwriting.mjs"
      - "scripts/audit-app-shell.mjs"
      # Learning-data audits run before packaging; re-run the build when they
      # (or their shared helpers) change so the gate cannot silently drift.
      - "scripts/audit-words-data.mjs"
      - "scripts/audit-sentences-data.mjs"
      - "scripts/audit-alphabet-audio.mjs"
      - "scripts/audit-hangul-recognition.mjs"
      - "scripts/lib/**"
      - "tests/fixtures/mobile_safe_area.html"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

# Pull requests must never see signing material; this workflow uses no secrets.
permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare, audit, and build debug Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Static app checks
        run: |
          node --check app.js
          node --check sw.js
          node scripts/audit-app-shell.mjs
          node scripts/test-mobile-safe-area-browser.mjs
          node scripts/test-android-release-safety.mjs
          node scripts/test-native-lesson-ads.mjs

      - name: Learning-data audits
        run: |
          node scripts/audit-words-data.mjs --strict
          node scripts/audit-sentences-data.mjs --strict
          node scripts/audit-alphabet-audio.mjs --strict
          node scripts/audit-hangul-recognition.mjs
          node scripts/audit-premium-handwriting.mjs

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate allowlisted web payload
        working-directory: mobile
        run: npm run prepare:web

      - name: Audit mobile package
        run: node scripts/audit-mobile-package.mjs

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK and run checks
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew lint testDebugUnitTest assembleDebug --no-daemon

      - name: Verify merged manifest permissions
        run: |
          merged=$(find mobile/android/app/build/intermediates/merged_manifests -path '*debug*' -name AndroidManifest.xml | sort | head -1)
          if [ -z "$merged" ]; then echo "merged debug manifest not found" >&2; exit 1; fi
          echo "Merged manifest: $merged"
          # Only <uses-permission> elements grant the app permissions. Other
          # android.permission.* strings in the merged manifest are caller
          # requirements rather than app grants and must not fail this check.
          perms=$(grep -oE '<uses-permission(-sdk-23)?[^>]*android:name="[^"]*"' "$merged" | grep -oE '"[^"]*"$' | tr -d '"' | sort -u || true)
          echo "Declared uses-permissions:"
          echo "${perms:-<none>}"
          # INTERNET + network state + advertising ID are the audited AdMob
          # surface. BILLING supports the optional ad-free subscription.
          # AndroidX may add the app's signature-level receiver guard.
          unexpected=$(echo "$perms" \
            | grep -v '^android\.permission\.INTERNET$' \
            | grep -v '^android\.permission\.ACCESS_NETWORK_STATE$' \
            | grep -v '^com\.google\.android\.gms\.permission\.AD_ID$' \
            | grep -v '^com\.android\.vending\.BILLING$' \
            | grep -v '^io\.github\.cameronnel\.hanapath\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION$' \
            | grep -v '^$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected permissions in merged manifest:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Report artifact sizes
        run: |
          ls -la mobile/android/app/build/outputs/apk/debug/
          du -sh mobile/www

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hanapath-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload package manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: www-package-manifest
          path: mobile/www-manifest.json
          retention-days: 14
