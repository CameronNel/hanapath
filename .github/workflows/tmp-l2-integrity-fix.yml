name: Diagnose L2 integrity binding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'core/l2-sentence-positional-near-miss-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout L2 branch
        uses: actions/checkout@v4
        with:
          ref: core/l2-sentence-positional-near-miss-feedback
          fetch-depth: 0
          show-progress: false

      - name: Capture exact audit failure
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/l2-integrity-diagnostic.txt; then
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'app.js': [
                  ('const EXAM_INTEGRITY_APP_VERSION = "hanapath-shell-v451";', 'const EXAM_INTEGRITY_APP_VERSION = "hanapath-shell-v452";'),
                  ('const EXAM_INTEGRITY_ASSET_REVISION = "20260726b";', 'const EXAM_INTEGRITY_ASSET_REVISION = "20260727a";'),
              ],
              'scripts/audit-exam-integrity.mjs': [
                  ('./app.js?v=20260726b', './app.js?v=20260727a'),
                  ('hanapath-shell-v451', 'hanapath-shell-v452'),
                  ('const EXAM_INTEGRITY_APP_VERSION = "hanapath-shell-v451"', 'const EXAM_INTEGRITY_APP_VERSION = "hanapath-shell-v452"'),
                  ('const EXAM_INTEGRITY_ASSET_REVISION = "20260726b"', 'const EXAM_INTEGRITY_ASSET_REVISION = "20260727a"'),
              ],
              'scripts/audit-sentence-lesson-contrasts.mjs': [('hanapath-shell-v451', 'hanapath-shell-v452')],
              'scripts/audit-sentence-lesson-contrasts-sections-5-8.mjs': [('hanapath-shell-v451', 'hanapath-shell-v452')],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new)
                  elif new not in text:
                      raise SystemExit(f'{name}: neither old nor new binding found: {old}')
              path.write_text(text)
          PY
          node scripts/audit-exam-integrity.mjs > /tmp/l2-integrity-diagnostic.txt 2>&1 || true
          git reset -- .
          git checkout -- .
          cp /tmp/l2-integrity-diagnostic.txt .github/l2-integrity-diagnostic.txt
          git config user.name 'HanaPath Coder'
          git config user.email 'noreply@openai.com'
          git add .github/l2-integrity-diagnostic.txt
          git commit -m 'chore: capture L2 integrity diagnostic'
          git push origin HEAD:core/l2-sentence-positional-near-miss-feedback
