name: Generate L3 authored audio

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'core/l3-authored-item-audio-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout L3 branch
        uses: actions/checkout@v4
        with:
          ref: core/l3-authored-item-audio-closure
          fetch-depth: 0
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official Edge TTS backend
        run: python -m pip install --disable-pip-version-check edge-tts

      - name: Verify authored discovery
        run: |
          node --check scripts/lib/authored-audio-targets.mjs
          node --check scripts/test-authored-audio-targets.mjs
          node --check scripts/audit-audio-coverage.mjs
          node scripts/test-authored-audio-targets.mjs

      - name: Generate missing authored audio through official pipeline
        run: python generate_assets.py --backend edge

      - name: Verify complete mapped coverage
        run: |
          node scripts/audit-audio-coverage.mjs --strict
          git diff --check

      - name: Commit generated audio assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HanaPath Audio Generator'
          git config user.email 'noreply@openai.com'
          git add audio_map.js audio/
          if git diff --cached --quiet; then
            echo 'No generated audio changes remain.'
            exit 0
          fi
          git commit -m 'L3: generate authored-item audio assets'
          git push origin HEAD:core/l3-authored-item-audio-closure
