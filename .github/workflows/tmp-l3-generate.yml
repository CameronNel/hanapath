name: Diagnose L3 Edge synthesis

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'core/l3-authored-item-audio-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout L3 branch
        uses: actions/checkout@v4
        with:
          ref: core/l3-authored-item-audio-closure
          fetch-depth: 0
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official Edge TTS backend
        run: python -m pip install --disable-pip-version-check edge-tts

      - name: Capture backend and first missing-key diagnostics
        shell: bash
        run: |
          set -euo pipefail
          {
            python --version
            python -m edge_tts --version || true
            python generate_assets.py --backend edge --smoke-key 안녕하세요
            TTS_WORKERS=1 timeout 90s python generate_assets.py --backend edge
          } > /tmp/l3-edge-diagnostic.txt 2>&1 || true
          tail -200 /tmp/l3-edge-diagnostic.txt
          cp /tmp/l3-edge-diagnostic.txt .github/l3-edge-diagnostic.txt
          git config user.name 'HanaPath Audio Diagnostic'
          git config user.email 'noreply@openai.com'
          git add .github/l3-edge-diagnostic.txt
          git commit -m 'chore: capture L3 Edge synthesis diagnostic'
          git push origin HEAD:core/l3-authored-item-audio-closure
