name: CB4 Refine Prompts

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  refine:
    name: Refine CB4 review proposals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refine selection and proposed prompts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          (
            set -e
            node scripts/cb4-refine-prompts.mjs --patch-builder
            node scripts/build-sentence-exam-curated-bank.mjs --write
            node scripts/cb4-refine-prompts.mjs --prefill-reviews
          ) > .cb4-refine.log 2>&1
          status=$?
          cat .cb4-refine.log
          if [ "$status" -ne 0 ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file .cb4-refine.log
            exit "$status"
          fi

      - name: Validate refined package
        run: |
          node --check scripts/build-sentence-exam-curated-bank.mjs
          node scripts/build-sentence-exam-curated-bank.mjs --check
          node scripts/audit-sentence-exam-curated-bank-cb4.mjs
          node scripts/test-sentence-exam-curated-bank-cb4.mjs
          node scripts/audit-sentence-exam-curated-bank.mjs
          node scripts/audit-core-release.mjs --write-status
          git diff --check

      - name: Commit refined authoring package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-sentence-exam-curated-bank.mjs \
            docs/generated/sentence_exam_curated_bank_cb4_authoring.json \
            docs/reviews/sentence_exam_curated_bank_cb4_reviews.json \
            docs/CORE_APP_STATUS.md
          git commit -m "CB4: refine typed selection and proposed prompts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
