name: CB2 Manual Contrast Overrides

on:
  pull_request:
    paths:
      - ".github/workflows/cb2-manual-contrast-overrides.yml"
      - "scripts/apply-cb2-semantic-overrides.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Apply and validate semantic overrides
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply explicit semantic overrides
        run: python scripts/apply-cb2-semantic-overrides.py
      - name: Regenerate and validate
        run: |
          node --check scripts/lib/sentence-lesson-contrast-authoring.mjs
          node --check scripts/build-sentence-lesson-contrasts.mjs
          node --check scripts/audit-sentence-lesson-contrasts.mjs
          node scripts/test-sentence-lesson-contrast-authoring.mjs
          node scripts/build-sentence-lesson-contrasts.mjs --write
          node scripts/build-sentence-lesson-contrasts.mjs --check
          node scripts/audit-sentence-lesson-contrasts.mjs
          node scripts/test-sentence-lesson-contrast-ui.mjs
          node scripts/test-sentence-lesson-contrasts-browser.mjs
          node scripts/audit-exam-integrity.mjs
          node scripts/audit-app-shell.mjs
      - name: Commit semantic overrides
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/lib/sentence-lesson-contrast-authoring.mjs scripts/build-sentence-lesson-contrasts.mjs scripts/audit-sentence-lesson-contrasts.mjs sentence_lesson_contrasts_sections_1_4.js docs/generated/sentence_lesson_contrasts_sections_1_4.json
          if git diff --cached --quiet; then
            echo "Semantic overrides already current."
            exit 0
          fi
          git commit -m "CB2: apply reviewed semantic contrast overrides"
          git push origin "HEAD:${HEAD_BRANCH}"
