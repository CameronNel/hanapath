name: fix-cb6b-replacement-semantics

on:
  push:
    branches:
      - core/cb6b-controlled-clause-reauthor

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Omit replaced invalid rows instead of demoting them
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-sentence-exam-capacity-remediation.mjs')
          s = p.read_text()
          old = '''const EFFECTIVE_SELECTED = Object.freeze([
            ...SELECTED.map((selection) => DEMOTED_IDS.has(selection.id)
              ? Object.freeze({ id: selection.id, mode: "recognition" })
              : selection),
            ...[...REPLACEMENT_BY_DEMOTED.values()].map((id) => Object.freeze({ id, mode: "typed" })),
          ]);'''
          new = '''const EFFECTIVE_SELECTED = Object.freeze([
            ...SELECTED.filter((selection) => !DEMOTED_IDS.has(selection.id)),
            ...[...REPLACEMENT_BY_DEMOTED.values()].map((id) => Object.freeze({ id, mode: "typed" })),
          ]);'''
          if old not in s:
            raise SystemExit('effective selection block not found')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('scripts/audit-sentence-exam-capacity-remediation.mjs')
          s = p.read_text()
          s = s.replace('const EXPECTED_ADDITIONS = 102;', 'const EXPECTED_ADDITIONS = 94;')
          s = s.replace('const EXPECTED_RECOGNITION = 31;', 'const EXPECTED_RECOGNITION = 23;')
          p.write_text(s)
          PY
          node scripts/build-sentence-exam-capacity-remediation.mjs --write
      - name: Re-run hardened audit report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import { auditCapacityRemediationState } from './scripts/audit-sentence-exam-capacity-remediation.mjs';
          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const sandbox = { window: {} };
          sandbox.self = sandbox.window;
          sandbox.globalThis = sandbox.window;
          vm.createContext(sandbox);
          for (const file of ['sentence_exam_curated_bank.js', 'sentence_exam_curated_bank_freeze.js']) vm.runInContext(fs.readFileSync(file, 'utf8'), sandbox, { filename: file });
          const result = auditCapacityRemediationState({
            authoring: read('docs/generated/sentence_exam_cb6_capacity_authoring.json'),
            reviews: read('docs/reviews/sentence_exam_cb6_capacity_reviews.json'),
            witness: read('docs/generated/sentence_exam_cb6_capacity_witness.json'),
            inventory: read('docs/generated/sentence_exam_inventory.json'),
            bank: sandbox.window.HANAPATH_SENTENCE_EXAM_CURATED_BANK,
            requireApproved: false,
          });
          fs.writeFileSync('docs/generated/sentence_exam_cb6b_capacity_audit.json', `${JSON.stringify({ schemaVersion: 1, ...result }, null, 2)}\n`);
          if (!result.ok) console.error(result.failures.join('\n'));
          NODE
      - name: Commit semantic fix and remove workflow
        run: |
          git config user.name "HanaPath packet worker"
          git config user.email "automation@hanapath.local"
          git rm .github/workflows/fix-cb6b-replacement-semantics.yml
          git add scripts docs/generated/sentence_exam_cb6_capacity_authoring.json docs/generated/sentence_exam_cb6_capacity_witness.json docs/generated/sentence_exam_cb6b_capacity_audit.json docs/reviews/sentence_exam_cb6_capacity_reviews.json
          git diff --cached --check
          git commit -m "CB6B: replace invalid rows without extra recognition entries"
          git push origin HEAD:core/cb6b-controlled-clause-reauthor
