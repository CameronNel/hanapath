name: X2 bootstrap patch

on:
  push:
    branches:
      - core/x2-sentence-exam-runner

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply X2 integration patches
        run: node scripts/apply-x2-bootstrap.mjs
      - name: Check X2 syntax
        run: |
          node --check sentence_exam_runner_core.js
          node --check sentence_exam_runner.js
          node --check scripts/audit-sentence-exam-runner.mjs
          node --check scripts/test-sentence-exam-runner.mjs
          node --check scripts/test-sentence-exam-runner-browser.mjs
      - name: Run focused X2 gates
        run: |
          node scripts/test-sentence-exam-runner.mjs
          node scripts/audit-sentence-exam-runner.mjs
          node scripts/audit-app-shell.mjs
          node scripts/test-sentence-exam-readiness.mjs
          node scripts/test-sentence-exam-runner-browser.mjs
      - name: Regenerate derived core status
        run: node scripts/audit-core-release.mjs --write-status
      - name: Remove bootstrap machinery and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-x2-bootstrap.mjs .github/workflows/x2-bootstrap.yml
          git add -A
          git diff --cached --check
          git commit -m "X2: integrate Sentence exam runner and retention"
          git push origin HEAD:core/x2-sentence-exam-runner
