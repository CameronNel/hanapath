<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sentence exam X2 browser fixture</title></head>
<body data-test-status="running">
  <pre id="result">RUNNING</pre>
  <iframe id="app" src="../../index.html?__wetest=1" style="width:100%;height:900px;border:0"></iframe>
  <script>
    (function () {
      const result = document.getElementById("result");
      const frame = document.getElementById("app");
      const fail = (message) => {
        document.body.dataset.testStatus = "fail";
        result.textContent = `FAIL ${message}`;
      };
      const pass = (message) => {
        document.body.dataset.testStatus = "pass";
        result.textContent = `PASS ${innerWidth}x${innerHeight} ${message}`;
      };
      const assert = (condition, message) => { if (!condition) throw new Error(message); };
      async function waitFor(predicate, timeout = 15000) {
        const started = Date.now();
        while (Date.now() - started < timeout) {
          const value = predicate();
          if (value) return value;
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
        throw new Error("timed out waiting for app fixture");
      }
      frame.addEventListener("load", async () => {
        try {
          const win = frame.contentWindow;
          const doc = frame.contentDocument;
          const hook = await waitFor(() => win.__sentenceExamTest);
          hook.unlockThrough(8);
          hook.openHub();
          await waitFor(() => doc.querySelectorAll("[data-sentence-exam]").length === 5);
          const cards = [...doc.querySelectorAll("[data-sentence-exam]")];
          assert(cards.length === 5, "expected exactly five Sentence exam cards");
          assert(cards.every((card) => !card.disabled), "all cards should unlock after section 8");
          const hubItem = hook.hubItem();
          assert(hubItem.sub === "Four cumulative stages, a mastery final, and delayed retention", "Sentence Mastery hub subtitle field is missing");
          assert(!Object.prototype.hasOwnProperty.call(hubItem, "desc"), "Sentence Mastery hub registered the unsupported desc field");
          const checksumFixture = { attemptId: "checksum-fixture", checksum: null };
          assert(hook.resultChecksumIsValid(checksumFixture) === false, "null result checksum was accepted");
          checksumFixture.checksum = win.HANAPATH_EXAM_INTEGRITY.fingerprint({ ...checksumFixture, checksum: null });
          assert(hook.resultChecksumIsValid(checksumFixture) === true, "valid result checksum was rejected");
          checksumFixture.attemptId = "checksum-tampered";
          assert(hook.resultChecksumIsValid(checksumFixture) === false, "tampered result checksum was accepted");
          const malformedMastery = hook.record("sentence-exam-5");
          malformedMastery.masteryEarnedAt = Date.now();
          assert(hook.masteryIsValid("sentence-exam-5") === false, "timestamp-only mastery record was accepted");
          assert(hook.retentionPhase("sentence-exam-5").phase === "incompatible", "timestamp-only mastery record rendered as mastered");
          const progressBefore = JSON.stringify(hook.sentenceProgress());

          hook.startAttempt("sentence-exam-1", "achievement", "x2-browser-seed");
          await waitFor(() => doc.querySelector("#sentenceExamInput"));
          const attempt = hook.attempt();
          assert(attempt.items.length === 24, "stage paper must have 24 items");
          assert(attempt.items.filter((item) => item.mode === "typed").length === 20, "stage paper must have 20 typed items");
          assert(attempt.items.filter((item) => item.mode === "recognition").length === 4, "stage paper must have 4 selected items");
          const detailText = doc.getElementById("screen-detail").textContent;
          assert(!/Correct!|Incorrect|accepted answer/i.test(detailText), "pre-submit correctness or accepted-answer feedback leaked");
          assert(!/word bank|next chunk|reveal answer/i.test(detailText), "helper ladder leaked into formal runner");

          const input = doc.querySelector("#sentenceExamInput");
          input.dispatchEvent(new CompositionEvent("compositionstart", { bubbles: true, data: "한" }));
          input.value = "한";
          input.dispatchEvent(new InputEvent("input", { bubbles: true, data: "한", inputType: "insertCompositionText" }));
          input.dispatchEvent(new CompositionEvent("compositionend", { bubbles: true, data: "한" }));
          assert(hook.attempt().answers[hook.attempt().items[0].itemId] === "한", "IME composition answer was not retained");

          hook.answerAllCorrect();
          hook.submitNow(false);
          await waitFor(() => hook.attempt()?.stage === "results");
          const saved = hook.state();
          const record = hook.record("sentence-exam-1");
          assert(record.attempts === 1, "submitted attempt count not preserved");
          assert(record.passed === false, "__wetest Practice attempt awarded progression");
          assert(saved.generationHistory["sentence-exam-1"].length === 1, "generation history missing submitted form");
          assert(saved.generationHistory["sentence-exam-1"][0].submittedAttemptId, "generation history not linked to result");
          assert(saved.generationHistory["sentence-exam-1"][0].status === "submitted", "submitted lifecycle status missing");
          assert(saved.generationHistory["sentence-exam-1"][0].integrityStatus === "practice", "Practice generation integrity status missing");
          assert(doc.getElementById("screen-detail").textContent.includes("Practice result"), "Practice disclosure missing");
          assert(doc.getElementById("screen-detail").textContent.includes("Full answer review"), "full answer review missing after submission");

          hook.startAttempt("sentence-exam-1", "achievement", "x2-browser-discard");
          await waitFor(() => hook.attempt()?.stage === "attempt");
          hook.discard();
          assert(hook.state().generationHistory["sentence-exam-1"].length === 2, "discarded form disappeared from freshness history");
          assert(hook.state().generationHistory["sentence-exam-1"][1].discarded === true, "discarded form was not marked");
          assert(hook.state().generationHistory["sentence-exam-1"][1].status === "discarded", "discard lifecycle status missing");
          const historyText = JSON.stringify(hook.state().generationHistory);
          assert(!historyText.includes("candidateAnswer"), "discarded candidate answers leaked into generation history");

          hook.startAttempt("sentence-exam-1", "achievement", "x2-browser-persistence-failure");
          await waitFor(() => hook.attempt()?.stage === "attempt");
          hook.answerAllCorrect();
          const weakItem = hook.attempt().items.find((item) => Array.isArray(item.sourceLessonIds) && item.sourceLessonIds.length);
          hook.attempt().answers[weakItem.itemId] = "__wrong__";
          const appState = hook.appState();
          const recordBeforeFailure = JSON.stringify(hook.record("sentence-exam-1"));
          const historyBeforeFailure = JSON.stringify(hook.state().generationHistory["sentence-exam-1"]);
          const resultsBeforeFailure = JSON.stringify(appState.examResults);
          const relationsBeforeFailure = JSON.stringify(appState.examIntegrity?.resultRelations || []);
          const originalSaveState = win.saveState;
          try {
            win.saveState = () => false;
            hook.submitNow(false);
          } finally {
            win.saveState = originalSaveState;
          }
          await waitFor(() => hook.attempt()?.stage === "results");
          assert(hook.attempt().result.persistenceFailed === true, "persistence failure was not surfaced");
          assert(hook.attempt().result.resultRecord.checksum === null, "unpersisted Practice result retained a HanaPath checksum");
          assert(JSON.stringify(hook.record("sentence-exam-1")) === recordBeforeFailure, "persistence failure did not restore the achievement record");
          assert(JSON.stringify(hook.state().generationHistory["sentence-exam-1"]) === historyBeforeFailure, "persistence failure did not restore generation lifecycle");
          assert(JSON.stringify(appState.examResults) === resultsBeforeFailure, "persistence failure did not restore the result store");
          assert(JSON.stringify(appState.examIntegrity?.resultRelations || []) === relationsBeforeFailure, "persistence failure did not restore result relations");
          assert(progressBefore === JSON.stringify(hook.sentenceProgress()), "Sentence exam mutated lesson/SRS progress");
          const weakRoute = doc.querySelector("[data-sentence-weak-route]");
          assert(weakRoute, "weak-area remediation route was not rendered");
          const weakLessonId = weakRoute.dataset.sentenceWeakRoute;
          weakRoute.click();
          await waitFor(() => !doc.getElementById("screen-speak").hidden && doc.getElementById("screen-detail").hidden);
          assert(hook.appState().navTab === "practice", `weak route ${weakLessonId} did not switch to the Sentence surface`);
          hook.unlockThrough(8);
          const retentionProgressBefore = JSON.stringify(hook.sentenceProgress());

          const finalExam = win.HANAPATH_SENTENCE_EXAMS.find((exam) => exam.id === "sentence-exam-5");
          const meta = win.HANAPATH_SENTENCE_EXAM_META;
          const core = win.HANAPATH_SENTENCE_EXAM_RUNNER;
          const engine = win.HANAPATH_SENTENCE_EXAM_ENGINE;
          const qualifierId = "attempt-x2-window-qualifier";
          const qualifierOpensAt = 2_000_000_000_000;
          const qualifierExpiresAt = qualifierOpensAt + 60_000;
          const qualifierGenerated = engine.generateAttempt(finalExam.id, "x2-window-qualifier", { freshnessHistory: [] });
          const qualifierGeneration = core.makeGenerationEntry(qualifierGenerated, {
            generatedAt: qualifierOpensAt - 7 * core.DAY_MS,
            status: "hanaPath",
            eligibilityRevision: win.HANAPATH_SENTENCE_EXAM_ELIGIBILITY.revision,
          });
          core.appendGenerationEntry(hook.state(), finalExam.id, qualifierGeneration);
          core.markGenerationSubmitted(hook.state(), finalExam.id, qualifierGeneration.generationId, qualifierId);
          const qualifierResult = core.buildResultRecord({
            attemptId: qualifierId,
            examId: finalExam.id,
            attemptMode: "achievement",
            blueprintVersion: meta.blueprintVersion,
            engineVersion: meta.engineVersion,
            generationSeed: qualifierGenerated.resolvedSeed,
            contentBankRevision: meta.contentBankRevision,
            eligibilityRevision: win.HANAPATH_SENTENCE_EXAM_ELIGIBILITY.revision,
            generatedAt: qualifierGeneration.generatedAt,
            submittedAt: qualifierGeneration.generatedAt + 1,
            durationSeconds: 1,
            scopeSectionIds: ["sn1", "sn2", "sn3", "sn4", "sn5", "sn6", "sn7", "sn8"],
            itemCount: finalExam.itemCount,
            scoreSummary: { correct: finalExam.itemCount, total: finalExam.itemCount, pct: 100, unanswered: 0 },
            floorSummary: { passed: true, distinguished: true, details: { mode: "achievement", passed: true, masteryQualified: true } },
            status: "hanaPath",
            overrideFlags: [],
            overrideEventIds: [],
            generationId: qualifierGeneration.generationId,
            answerReview: [],
            responseTiming: {},
          });
          const qualifierChecksum = () => win.HANAPATH_EXAM_INTEGRITY.fingerprint(
            win.Object.assign(new win.Object(), qualifierResult, { checksum: null }),
          );
          qualifierResult.checksum = qualifierChecksum();
          appState.examResults.byAttemptId[qualifierId] = qualifierResult;
          Object.assign(hook.record(finalExam.id), {
            masteryEarnedAt: null,
            retentionAttemptId: null,
            qualifyingAttemptId: qualifierId,
            confirmationDueFrom: qualifierOpensAt,
            confirmationExpiresAt: qualifierExpiresAt,
            qualifyingTargetKeys: qualifierGenerated.targetKeys.slice(),
          });
          assert(hook.qualifierIsValid(finalExam.id), "compatible browser qualifier fixture was rejected");

          hook.setNow(qualifierOpensAt);
          hook.startAttempt(finalExam.id, "retention", "x2-retention-expiry-submit");
          assert(hook.attempt(), `open retention window did not start: ${doc.getElementById("screen-detail").textContent}`);
          await waitFor(() => hook.attempt()?.stage === "attempt");
          hook.answerAllCorrect();
          hook.setNow(qualifierExpiresAt + 1);
          hook.submitNow(false);
          await waitFor(() => hook.attempt()?.stage === "results");
          assert(hook.attempt().result.resultRecord.overrideFlags.includes("retention-window-not-open"), "expired retention submission did not degrade to Practice");
          assert(hook.record(finalExam.id).masteryEarnedAt === null, "expired retention submission awarded mastery");
          doc.querySelector("#sentenceExamBackHub").click();
          await waitFor(() => hook.attempt() === null);

          hook.setNow(qualifierExpiresAt + 1);
          hook.startAttempt(finalExam.id, "retention", "x2-retention-expired-start");
          await waitFor(() => doc.getElementById("screen-detail").textContent.includes("not currently open"));
          assert(hook.attempt() === null, "expired retention window allowed a new attempt to start");

          assert(retentionProgressBefore === JSON.stringify(hook.sentenceProgress()), "retention attempt mutated lesson/SRS progress");
          pass("Sentence X2 runner, retention windows, remediation routing, provenance, rollback, and review");
        } catch (error) {
          fail(error && error.stack ? error.stack : String(error));
        }
      });
    })();
  </script>
</body>
</html>
