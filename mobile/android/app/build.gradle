apply plugin: 'com.android.application'

// Public release configuration. None of these values are secrets, but they are
// owner-controlled identifiers and source builds must remain safe when they are
// absent. Debug builds use Google's dedicated sample/test AdMob identifiers;
// release builds do not request ads until both production identifiers exist.
def googleSignInServerClientId = providers
    .gradleProperty('HANAPATH_GOOGLE_SERVER_CLIENT_ID')
    .orElse(providers.environmentVariable('HANAPATH_GOOGLE_SERVER_CLIENT_ID'))
    .getOrElse('')
    .trim()
def adMobAppId = providers
    .gradleProperty('HANAPATH_ADMOB_APP_ID')
    .orElse(providers.environmentVariable('HANAPATH_ADMOB_APP_ID'))
    .getOrElse('')
    .trim()
def adMobInterstitialId = providers
    .gradleProperty('HANAPATH_ADMOB_INTERSTITIAL_ID')
    .orElse(providers.environmentVariable('HANAPATH_ADMOB_INTERSTITIAL_ID'))
    .getOrElse('')
    .trim()
def adMobConfigured = !adMobAppId.isEmpty() && !adMobInterstitialId.isEmpty()
def playBillingPublicKey = providers
    .gradleProperty('HANAPATH_PLAY_BILLING_PUBLIC_KEY')
    .orElse(providers.environmentVariable('HANAPATH_PLAY_BILLING_PUBLIC_KEY'))
    .getOrElse('')
    .trim()
def playBillingConfigured = !playBillingPublicKey.isEmpty()
def effectiveAdMobAppId = adMobConfigured
    ? adMobAppId
    : 'ca-app-pub-3940256099942544~3347511713'

def escapeBuildConfigString = { value ->
    value
        .replace('\\', '\\\\')
        .replace('"', '\\"')
        .replace('\r', '')
        .replace('\n', '')
}
def escapedGoogleSignInServerClientId = escapeBuildConfigString(googleSignInServerClientId)
def escapedAdMobInterstitialId = escapeBuildConfigString(adMobInterstitialId)
def escapedPlayBillingPublicKey = escapeBuildConfigString(playBillingPublicKey)

android {
    namespace = "io.github.cameronnel.hanapath"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.cameronnel.hanapath"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The protected release workflow rewrites these placeholders through
        // mobile/scripts/version-android.mjs and enforces monotonic versionCode
        // tags before any signed AAB is produced.
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [hanapathAdMobAppId: effectiveAdMobAppId]
        buildConfigField "String", "GOOGLE_SIGN_IN_SERVER_CLIENT_ID", "\"${escapedGoogleSignInServerClientId}\""
        buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${escapedAdMobInterstitialId}\""
        buildConfigField "boolean", "ADMOB_CONFIGURED", adMobConfigured.toString()
        buildConfigField "String", "PLAY_BILLING_PUBLIC_KEY", "\"${escapedPlayBillingPublicKey}\""
        buildConfigField "boolean", "PLAY_BILLING_CONFIGURED", playBillingConfigured.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Upload-key signing (handover §13.2/§14). Populated only when the
        // protected release workflow — or the owner's machine — exports the
        // HANAPATH_UPLOAD_* environment variables. PR builds, debug builds,
        // and plain local builds have none of them set and keep producing an
        // unsigned release exactly as before. The keystore itself is never
        // committed (.gitignore blocks *.jks/*.keystore).
        if (System.getenv("HANAPATH_UPLOAD_KEYSTORE_FILE")) {
            upload {
                storeFile file(System.getenv("HANAPATH_UPLOAD_KEYSTORE_FILE"))
                storePassword System.getenv("HANAPATH_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("HANAPATH_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("HANAPATH_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("HANAPATH_UPLOAD_KEYSTORE_FILE")) {
                signingConfig signingConfigs.upload
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // Every learning feature remains free. The single Play subscription only
    // suppresses Android interstitial ads while its entitlement is active.
    implementation 'com.android.billingclient:billing:9.1.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
